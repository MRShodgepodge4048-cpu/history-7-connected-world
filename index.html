nly on islands located in the Pacific Ocean."],"answer":0,"why":"Correct response: Spain established colonies across much of Central and South America.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-005","stem":"Why did European nations become interested in exploration during the 1400s?","options":["They wanted to end international trade between kingdoms.","They wanted to prevent new technologies from spreading.","They wanted wealth, trade routes, resources, and new markets.","They wanted to move European populations away from cities.","They wanted to replace farming with local hunting economies."],"answer":2,"why":"Correct response: They wanted wealth, trade routes, resources, and new markets.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-006","stem":"How did the Black Death contribute indirectly to European exploration?","options":["It caused Europeans to abandon international trade permanently.","It increased the demand for workers and encouraged economic change.","It caused European kingdoms to stop competing for resources.","It ended the use of ships for transportation and trade.","It prevented European merchants from traveling outside Europe."],"answer":1,"why":"Correct response: It increased the demand for workers and encouraged economic change.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-007","stem":"The line drawn north to south through the Atlantic, in order to divide the non-European world between Portugal and Spain, was the product of what treaty?","options":["Treaty of Rome","Treaty of Tordesillas","Treaty of Demarcation","Treaty of Paris"],"answer":1,"why":"Correct response: Treaty of Tordesillas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-008","stem":"Which technological development most directly helped European sailors explore farther from Europe?","options":["Improved ships and navigation tools made longer voyages possible.","Improved printing presses made ocean travel unnecessary for merchants.","Improved farming tools allowed sailors to avoid using ships.","Improved weapons prevented European kingdoms from competing overseas.","Improved roads allowed merchants to travel around the entire world."],"answer":0,"why":"Correct response: Improved ships and navigation tools made longer voyages possible.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-009","stem":"Why did trade increase in Afro-Eurasia after about 1200 CE?","options":["Large empires completely eliminated competition between merchants","European kingdoms closed their ports to foreign merchants.","New trading networks connected fewer cities and fewer regions","Better ships, ports, and trading organizations supported commerce.","Most merchants stopped traveling and traded only within villages."],"answer":3,"why":"Correct response: Better ships, ports, and trading organizations supported commerce.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-010","stem":"Why did the Native American population decline dramatically after European contact?","options":["Native Americans voluntarily moved to European settlements.","Native Americans stopped farming and moved into cities.","European diseases caused widespread deaths among Native Americans","European governments prevented Native Americans from having children.","Native Americans were unaffected by European diseases and warfare."],"answer":2,"why":"Correct response: European diseases caused widespread deaths among Native Americans.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-011","stem":"How did European exploration affect the Indian Ocean trade network?","options":["Europeans completely ended all trade between Asian merchants.","Europeans avoided the Indian Ocean because it was too dangerous.","Europeans became involved and used force to control important routes.","Europeans moved all Indian Ocean trade to the Atlantic Ocean.","Europeans gave control of major ports to local African kingdoms."],"answer":2,"why":"Correct response: Europeans became involved and used force to control important routes.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-012","stem":"Which statement best compares the goals of Portugal and Spain during exploration?","options":["Portugal focused on Asian trade routes, while Spain sought western lands and wealth.","Portugal focused on North American farming, while Spain avoided colonization.","Portugal avoided overseas trade, while Spain focused only on African ports.","Portugal explored mainly for religion, while Spain explored mainly for farming.","Portugal and Spain had identical goals and created identical empires."],"answer":0,"why":"Correct response: Portugal focused on Asian trade routes, while Spain sought western lands and wealth.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-013","stem":"Which statement best describes French and English exploration in the Americas?","options":["Both countries focused entirely on controlling Spanish silver mines.","Both countries avoided trade with Native American communities.","Both countries established colonies only in Central and South America.","Both countries focused mainly on conquering the Incan Empire.","Both countries developed colonies and competed for land and trade."],"answer":4,"why":"Correct response: Both countries developed colonies and competed for land and trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-014","stem":"Which economic activity was especially important to Spain's empire?","options":["Fur trading and shipping","Banking and commercial shipping","Silver mining and plantation agriculture","Spice trading and gold mining","Industrial manufacturing and raw materials"],"answer":2,"why":"Correct response: Silver mining and plantation agriculture.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-015","stem":"How did the Netherlands attempt to dominate the spice trade?","options":["By conquering the Incan Empire and controlling silver mines","By creating settler colonies across eastern North America","By using naval power and the Dutch East India Company","By establishing alliances with France and avoiding military action","By controlling Caribbean plantations and Spanish trading ports"],"answer":2,"why":"Correct response: By using naval power and the Dutch East India Company.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-016","stem":"Which statement best describes France's approach to building its empire?","options":["France focused mainly on conquering large empires in South America.","France relied primarily on naval warfare and spice monopolies.","France used trading alliances, fur networks, and plantation colonies.","France focused on silver mining and galleon trade across the Pacific.","France avoided trade with Native Americans and focused on farming."],"answer":2,"why":"Correct response: France used trading alliances, fur networks, and plantation colonies.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-017","stem":"Which empire relied most heavily on controlling strategic ports and sea lanes rather than conquering large inland territories?","options":["Spain","England","France","Portugal","Netherlands"],"answer":3,"why":"Correct response: Portugal.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-018","stem":"Which empire is correctly matched with one of its important locations?","options":["Spain — Quebec","France — Peru","Portugal — Goa","England — Batavia","Netherlands — Louisiana"],"answer":2,"why":"Correct response: Portugal — Goa.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-019","stem":"Which empire was most closely associated with the Dutch East India Company, or VOC?","options":["Portugal","Spain","France","England","Netherlands"],"answer":4,"why":"Correct response: Netherlands.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-020","stem":"Which statement best explains why these European empires are called maritime empires?","options":["They depended mostly on farming within their European territories.","They avoided using ships and relied mainly on land-based armies.","They built power through overseas trade, ports, ships, and sea routes.","They focused on conquering neighboring European kingdoms by land.","They controlled only coastal areas and avoided international commerce."],"answer":2,"why":"Correct response: They built power through overseas trade, ports, ships, and sea routes.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-021","stem":"What was one major goal of Spanish conquistadors in the Americas?","options":["To establish peaceful trade without claiming territory or resources.","To gain wealth, territory, and power for Spain.","To prevent Spanish settlers from establishing permanent colonies.","To create independent Native American governments across the Americas.","To end European competition over overseas territories."],"answer":1,"why":"Correct response: To gain wealth, territory, and power for Spain.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-022","stem":"Which statement best explains how maritime empires grew during this period?","options":["European nations expanded by controlling sea routes, ports, and colonies.","European nations expanded mainly by conquering landlocked Asian kingdoms.","European nations avoided overseas territories because ships were expensive.","European nations gave up control of trade routes to local merchants.","European nations stopped competing once Atlantic trade became profitable."],"answer":0,"why":"Correct response: European nations expanded by controlling sea routes, ports, and colonies.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-023","stem":"Why did Europeans increasingly use forced labor in the Americas?","options":["European colonies had too many workers for their agricultural needs.","European governments banned plantation agriculture throughout the Americas.","Colonists needed large amounts of labor for mines and plantations.","Native American societies asked to participate in any form of farming.","European merchants wanted to reduce the production of cash crops."],"answer":2,"why":"Correct response: Colonists needed large amounts of labor for mines and plantations.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-024","stem":"What was the Middle Passage?","options":["The land route used by Spanish explorers to cross South America.","The sea journey that transported enslaved Africans to the Americas.","The trade route used by European merchants to reach East Asia.","The route used by Native Americans to migrate across North America.","The ocean route used by explorers to travel around the Pacific."],"answer":1,"why":"Correct response: The sea journey that transported enslaved Africans to the Americas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-025","stem":"Why did syncretic religions develop in the Atlantic world?","options":["Different cultures came into contact and blended religious traditions.","European governments required everyone to practice the same religion.","African societies completely abandoned their traditional religious beliefs.","Native American cultures refused to interact with European colonists.","European and African religions remained completely separate from each other."],"answer":0,"why":"Correct response: Different cultures came into contact and blended religious traditions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-026","stem":"Where did Santería develop?","options":["Cuba and other parts of the Caribbean","Brazil and parts of South America","Jamaica and parts of Central America","Haiti and parts of West Africa","Mexico and parts of North America"],"answer":0,"why":"Correct response: Cuba and other parts of the Caribbean.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-027","stem":"Which statement best describes the origins of Rastafari?","options":["It developed in Jamaica and emphasized African heritage and identity.","It developed in Haiti and blended African traditions with Catholicism.","It developed in Cuba and blended African traditions with Catholicism.","It developed in Brazil as a religion created by Portuguese colonists.","It developed in Europe as a movement supporting overseas exploration."],"answer":0,"why":"Correct response: It developed in Jamaica and emphasized African heritage and identity.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-028","stem":"Which person is an important figure in Rastafari beliefs and history?","options":["Christopher Columbus","Vasco da Gama","Bartolomeu Dias","Haile Selassie","Hernán Cortés"],"answer":3,"why":"Correct response: Haile Selassie.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-029","stem":"What was the network of trade that connected Europe, Africa, and the Americas?","options":["Golden Age","Triangular Trade","Slave Trade","Middle Passage"],"answer":1,"why":"Correct response: Triangular Trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-030","stem":"How did colonies help European countries practice mercantilism?","options":["Colonies provided resources and served as markets for European goods.","Colonies prevented European countries from trading with other regions.","Colonies received most of Europe's gold and silver from overseas trade.","Colonies were allowed to control European trade and economic policies.","Colonies produced goods mainly for themselves rather than for European markets."],"answer":0,"why":"Correct response: Colonies provided resources and served as markets for European goods.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-031","stem":"Which situation is the best example of mercantilism?","options":["A country allows its colony to trade freely with every country in the world.","A country closes its ports and stops collecting resources from its colonies.","A country uses colonial resources to make money and strengthens its own economy.","A country gives its colonies control over all overseas trade and shipping.","A country avoids overseas expansion because colonies are too expensive to maintain."],"answer":2,"why":"Correct response: A country uses colonial resources to make money and strengthens its own economy.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-032","stem":"What was the primary purpose of the tributary system used by the Ming Dynasty?","options":["To allow foreign kingdoms to govern Chinese provinces in exchange for protecting imperial borders.","To require Chinese merchants to pay European governments for permission to use maritime routes.","To provide foreign rulers with military authority over Chinese territories in exchange for annual taxation.","To reinforce China's superior diplomatic status through tribute missions that could receive gifts and trading privileges."],"answer":3,"why":"Correct response: To reinforce China's superior diplomatic status through tribute missions that could receive gifts and trading privileges.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-033","stem":"Which combination of factors contributed most directly to the early expansion of the Ottoman Empire?","options":["Ghazi warriors supported territorial conquest while control of important trade routes generated wealth.","Janissary commanders organized frontier settlements while European bankers financed Ottoman military campaigns.","Regional governors established independent armies while restrictions on foreign trade protected Ottoman industries.","Merchant organizations conquered Byzantine territories while alliances with Persian rulers secured Ottoman borders."],"answer":0,"why":"Correct response: Ghazi warriors supported territorial conquest while control of important trade routes generated wealth.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-034","stem":"How did Queen Nzinga of Ndongo resist Portuguese expansion in Central Africa?","options":["She accepted Portuguese military rule while negotiating exemptions from European trade restrictions.","She used diplomatic negotiations, military resistance, and alliances to challenge Portuguese influence.","She organized the Pueblo Revolt and established independent Indigenous communities in the Americas.","She ended diplomatic relations with neighboring African states and relied exclusively on Portuguese protection."],"answer":1,"why":"Correct response: She used diplomatic negotiations, military resistance, and alliances to challenge Portuguese influence.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-035","stem":"Which statement best compares the Treaty of Nerchinsk (1689) and the Treaty of Nanjing (1842)?","options":["Both treaties established peaceful borders between China and neighboring empires through negotiations between equal powers.","The Treaty of Nerchinsk surrendered Chinese territory to Russia, while the Treaty of Nanjing expanded Qing authority over British ports.","The Treaty of Nerchinsk established a negotiated border with Russia, while the Treaty of Nanjing forced China to make territorial and trade concessions to Britain.","Both treaties strengthened Chinese control over foreign trade by limiting European merchants to a single coastal trading port."],"answer":2,"why":"Correct response: The Treaty of Nerchinsk established a negotiated border with Russia, while the Treaty of Nanjing forced China to make territorial and trade concessions to Britain.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-036","stem":"Which statement correctly describes the role of Confucianism and mandarins in Ming government?","options":["Mandarins were military commanders selected through hereditary rank, while Confucianism established the empire’s military laws.","Mandarins were Buddhist religious leaders appointed by the emperor, while Confucianism regulated religious ceremonies.","Mandarins were provincial merchants responsible for collecting silver, while Confucianism established commercial regulations.","Mandarins were educated government officials selected through civil service examinations based largely on Confucian teachings."],"answer":3,"why":"Correct response: Mandarins were educated government officials selected through civil service examinations based largely on Confucian teachings.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-037","stem":"Which statement best describes King Afonso I of Kongo's response to Portuguese involvement in the slave trade?","options":["He protested the unauthorized enslavement of his subjects while attempting to maintain diplomatic and commercial relations with Portugal.","He prohibited all contact with Portuguese merchants and organized an alliance to expel European settlements from Africa.","He encouraged Portuguese merchants to enslave his subjects while refusing to establish political relationships with European rulers.","He surrendered control of Kongo to Portuguese officials in exchange for European protection against neighboring African kingdoms."],"answer":0,"why":"Correct response: He protested the unauthorized enslavement of his subjects while attempting to maintain diplomatic and commercial relations with Portugal.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-038","stem":"Which statement best compares the economic strategies of the Dutch and Spanish maritime empires?","options":["The Dutch relied primarily on plantation agriculture, while Spain established merchant-controlled trading companies throughout Asia.","The Dutch developed trading companies to dominate commerce, while Spain gained enormous wealth through silver mining in the Americas.","The Dutch relied on conquering Indigenous American empires, while Spain controlled the Asian spice trade through commercial monopolies.","The Dutch focused on collecting agricultural tribute in Mexico, while Spain developed joint-stock companies to finance trade in Indonesia."],"answer":1,"why":"Correct response: The Dutch developed trading companies to dominate commerce, while Spain gained enormous wealth through silver mining in the Americas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-039","stem":"Which statement correctly explains the relationship between the Devshirme System and the Janissary Corps?","options":["The Devshirme System recruited Muslim nobles, while the Janissary Corps trained their sons as provincial administrators.","The Devshirme System collected taxes from Christian communities, while the Janissary Corps used the revenue to purchase weapons.","The Devshirme System recruited Christian boys for Ottoman service, while the Janissary Corps trained selected recruits as elite soldiers.","The Devshirme System organized provincial military forces, while the Janissary Corps recruited independent soldiers from conquered territories."],"answer":2,"why":"Correct response: The Devshirme System recruited Christian boys for Ottoman service, while the Janissary Corps trained selected recruits as elite soldiers.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-040","stem":"How did the European demand for Chinese tea contribute to the conflict that led to the Opium Wars?","options":["European purchases of tea encouraged Qing officials to eliminate all taxes on imported British manufactured goods.","European demand for tea led Chinese merchants to purchase increasing quantities of British industrial equipment.","European merchants exchanged tea directly for territory, creating disagreements over the ownership of Chinese ports.","European purchases of tea helped drive silver into China, encouraging Britain to expand opium sales to reverse the imbalance."],"answer":3,"why":"Correct response: European purchases of tea helped drive silver into China, encouraging Britain to expand opium sales to reverse the imbalance.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-041","stem":"Who led the major Ming naval expeditions that expanded China's diplomatic and trade relationships during the Yongle Emperor's reign?","options":["Zheng He","Xu Da","Kangxi","Qianlong"],"answer":0,"why":"Correct response: Zheng He.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-042","stem":"How did the expansion of the Atlantic Slave Trade affect West African societies?","options":["It eliminated existing social hierarchies as European merchants established equal trading relationships with African kingdoms.","It increased warfare and slave raiding, disrupted communities, and allowed some rulers and merchants to accumulate wealth.","It reduced competition among African kingdoms as European powers prohibited the capture and sale of enslaved people.","It ended traditional gender roles as African rulers required men and women to perform identical military responsibilities."],"answer":1,"why":"Correct response: It increased warfare and slave raiding, disrupted communities, and allowed some rulers and merchants to accumulate wealth.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-043","stem":"What was the primary motivation behind the rebellion led by Túpac Amaru II in 1780?","options":["To establish Portuguese trading settlements and expand European commercial influence in Peru.","To restore Spanish authority over colonies that had declared independence from Europe.","To resist Spanish colonial exploitation, including forced labor and oppressive taxation.","To establish French political control over Indigenous communities in South America."],"answer":2,"why":"Correct response: To resist Spanish colonial exploitation, including forced labor and oppressive taxation.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-044","stem":"How did Ottoman control of major trade routes contribute to the empire's cultural achievements?","options":["Trade restrictions reduced foreign competition and encouraged private merchants to replace government artistic patronage.","Profits from international commerce allowed provincial merchants to establish independent governments and religious institutions.","Government monopolies eliminated regional competition and transferred responsibility for architecture to the Janissary Corps.","Taxes and customs duties generated revenue that supported monumental architecture, artistic production, and imperial construction."],"answer":3,"why":"Correct response: Taxes and customs duties generated revenue that supported monumental architecture, artistic production, and imperial construction.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-045","stem":"Which statement best compares the governing techniques of the Ming and Qing dynasties?","options":["The Ming relied on Confucian civil service officials, while the Qing retained that bureaucracy but added Manchu military control through the Banner System.","The Ming governed through hereditary military leaders, while the Qing replaced provincial administrators with independent merchant organizations.","The Ming relied on Manchu military commanders, while the Qing eliminated their authority and replaced them with elected provincial councils.","The Ming governed through independent religious communities, while the Qing abolished the civil service examinations and established military rule."],"answer":0,"why":"Correct response: The Ming relied on Confucian civil service officials, while the Qing retained that bureaucracy but added Manchu military control through the Banner System.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-046","stem":"What was the purpose of the Single-Whip Tax System introduced during the Ming Dynasty?","options":["To replace provincial taxation with mandatory military service performed by all Chinese households.","To combine several taxes and labor obligations into payments increasingly collected in silver.","To transfer responsibility for collecting imperial taxes from Chinese officials to foreign merchants.","To eliminate agricultural taxation and fund the government entirely through international maritime trade."],"answer":1,"why":"Correct response: To combine several taxes and labor obligations into payments increasingly collected in silver.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-047","stem":"Which statement correctly identifies the modern-day locations of the Ashanti, Oyo, Benin, and Kongo kingdoms?","options":["Ashanti was in modern-day Nigeria, Oyo in Ghana, Benin in Cameroon, and Kongo in Angola.","Ashanti was in modern-day Ghana, Oyo in Benin, Benin in Togo, and Kongo in Ethiopia.","Ashanti was in modern-day Ghana, Oyo and Benin in Nigeria, and Kongo in Angola.","Ashanti was in modern-day Mali, Oyo and Benin in Ghana, and Kongo in the Republic of the Congo."],"answer":2,"why":"Correct response: Ashanti was in modern-day Ghana, Oyo and Benin in Nigeria, and Kongo in Angola.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-048","stem":"Which statement best describes the Millet System and the jizya tax in the Ottoman Empire?","options":["The Millet System required religious conversion, while the jizya was collected from communities that resisted conversion.","The Millet System granted communities political independence, while the jizya supported their separate military forces.","The Millet System established uniform religious laws, while the jizya was collected exclusively from Muslim households.","The Millet System allowed religious communities limited self-government, while the jizya taxed eligible non-Muslim subjects."],"answer":3,"why":"Correct response: The Millet System allowed religious communities limited self-government, while the jizya taxed eligible non-Muslim subjects.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-049","stem":"What was a major cause of the Pueblo Revolt of 1680 in present-day New Mexico?","options":["Spanish restrictions on Indigenous religious practices and demands for labor and tribute.","British attempts to seize Pueblo farmland and establish permanent military settlements.","French efforts to replace traditional Pueblo governments with independent trading companies.","Portuguese demands that Pueblo communities participate in the Atlantic Slave Trade."],"answer":0,"why":"Correct response: Spanish restrictions on Indigenous religious practices and demands for labor and tribute.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-050","stem":"How did the Canton System regulate trade between Qing China and European merchants?","options":["European merchants could trade in every coastal province but were required to use government-owned vessels.","European merchants were restricted primarily to Guangzhou and conducted trade through authorized Chinese merchants.","European merchants could establish independent trading cities but were prohibited from selling Chinese goods abroad.","European merchants were required to travel to Beijing and receive personal trading permits from the emperor."],"answer":1,"why":"Correct response: European merchants were restricted primarily to Guangzhou and conducted trade through authorized Chinese merchants.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-051","stem":"What was the name of the massive collection of Chinese knowledge, literature, and philosophy commissioned during the Ming Dynasty?","options":["The Confucian Civil Service Register","The Imperial Tributary Records","The Yongle Encyclopedia","The Single-Whip Collection"],"answer":2,"why":"Correct response: The Yongle Encyclopedia.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-052","stem":"Which combination of developments contributed to the weakening of Ottoman power over time?","options":["Religious conflicts eliminated the millet system, while European merchants abandoned Mediterranean trade routes.","Provincial governors abolished the sultanate, while European governments stopped participating in Ottoman commerce.","Janissary recruitment prevented military modernization, while European rulers ended all diplomatic relations with Istanbul.","Violent dynastic succession practices, including fratricide, combined with increasing European political and economic pressure."],"answer":3,"why":"Correct response: Violent dynastic succession practices, including fratricide, combined with increasing European political and economic pressure.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-053","stem":"What was the primary purpose of Maroon societies in the Americas?","options":["To establish colonial settlements that expanded European control over inland territories.","To organize trading companies that supplied enslaved workers to European plantations.","To establish religious missions that converted Indigenous populations to Christianity.","To create independent communities where people escaping slavery could live beyond enslavers' control."],"answer":3,"why":"Correct response: To create independent communities where people escaping slavery could live beyond enslavers' control.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-054","stem":"What did extraterritorial rights granted to foreigners in nineteenth-century China generally mean?","options":["Certain foreign nationals were subject to their own country's legal authorities rather than ordinary Chinese courts.","Certain foreign nationals were authorized to govern Chinese provinces without obtaining permission from the emperor.","Certain foreign nationals were exempt from every commercial tax collected by the Chinese imperial government.","Certain foreign nationals were permitted to control China's military defenses and appoint provincial governors."],"answer":0,"why":"Correct response: Certain foreign nationals were subject to their own country's legal authorities rather than ordinary Chinese courts.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-055","stem":"How did global silver trade affect the Ming Dynasty's economy?","options":["Silver exports from China financed European colonies and reduced the importance of agricultural taxation.","European governments prohibited silver shipments to China, forcing the Ming to abandon international trade.","Silver from Japan and the Americas entered China through trade, becoming increasingly important for taxes and commerce.","Chinese merchants exchanged silver exclusively with neighboring states, preventing participation in wider global trade."],"answer":2,"why":"Correct response: Silver from Japan and the Americas entered China through trade, becoming increasingly important for taxes and commerce.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-056","stem":"Which statement accurately describes the geographical expansion of the Ottoman Empire?","options":["The empire began in the Balkans before expanding eastward into the Anatolian Peninsula.","The empire began near Istanbul before expanding exclusively into the Arabian Peninsula.","The empire began in Anatolia, expanded into the Balkans, and eventually captured Constantinople.","The empire began in Persia before expanding westward into Greece and northern Africa."],"answer":2,"why":"Correct response: The empire began in Anatolia, expanded into the Balkans, and eventually captured Constantinople.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-057","stem":"How did the Red Turban Rebellion contribute to the establishment of the Ming Dynasty?","options":["It weakened the Mongol-led Yuan Dynasty, allowing the Yongle Emperor to establish the Ming Dynasty.","It weakened the Mongol-led Yuan Dynasty, allowing Hongwu (Zhu Yuanzhang) to establish the Ming Dynasty.","It strengthened the Mongol-led Yuan Dynasty, allowing Hongwu to establish a new government under Mongol authority.","It strengthened the Mongol-led Yuan Dynasty, allowing the Yongle Emperor to expand Mongol rule throughout China."],"answer":1,"why":"Correct response: It weakened the Mongol-led Yuan Dynasty, allowing Hongwu (Zhu Yuanzhang) to establish the Ming Dynasty.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-058","stem":"How did the Banner System contribute to the expansion and stability of the Qing Empire?","options":["It divided China into independent provinces governed by merchants who financed military campaigns.","It replaced traditional military organization with a civilian government controlled by Confucian scholars.","It established coastal trading organizations responsible for defending ports against foreign merchants.","It organized Manchu and other populations into military units that supported conquest and imperial authority."],"answer":3,"why":"Correct response: It organized Manchu and other populations into military units that supported conquest and imperial authority.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-059","stem":"What was the significance of the Ottoman victory at the Battle of Chaldiran in 1514?","options":["Ottoman cavalry defeated Austrian forces and extended imperial authority across much of central Europe.","Ottoman warships defeated Portuguese fleets and established control over several important Indian Ocean ports.","Ottoman gunpowder weapons helped defeat Safavid forces and strengthened imperial control in eastern Anatolia.","Ottoman infantry defeated Byzantine defenders and established imperial authority over Constantinople and nearby territories."],"answer":2,"why":"Correct response: Ottoman gunpowder weapons helped defeat Safavid forces and strengthened imperial control in eastern Anatolia.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-060","stem":"Which comparison most accurately describes the territorial achievements of Kangxi and Qianlong?","options":["Kangxi conquered Britain’s Asian colonies, while Qianlong established permanent Qing control over Japan.","Kangxi captured Constantinople, while Qianlong expanded Qing military influence throughout the Middle East.","Kangxi consolidated Qing control and secured frontier territories, while Qianlong expanded into Central Asia.","Kangxi established Qing rule in India, while Qianlong transferred frontier authority to European governments."],"answer":2,"why":"Correct response: Kangxi consolidated Qing control and secured frontier territories, while Qianlong expanded into Central Asia.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-061","stem":"Why did the kowtow become a source of diplomatic tension between Qing China and Britain?","options":["British ambassadors demanded that Qing officials bow before European monarchs during negotiations over trade agreements.","Qing officials refused to allow British merchants to perform traditional ceremonies when entering Chinese trading ports.","Qing officials expected foreign ambassadors to bow in submission to the emperor, but British representatives resisted because they considered their monarch equal.","British representatives demanded that the emperor abandon Chinese diplomatic traditions and recognize European authority over foreign trade."],"answer":2,"why":"Correct response: Qing officials expected foreign ambassadors to bow in submission to the emperor, but British representatives resisted because they considered their monarch equal.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-062","stem":"How did Shah Isma'il I use religion to strengthen the Safavid Empire?","options":["He made Sunni Islam the official religion to improve relations with the Ottomans.","He established Twelver Shi'a Islam as the state religion, creating a distinct religious identity.","He abolished Islamic religious institutions and replaced them with secular government.","He allowed the Ottoman sultan to appoint Safavid religious leaders."],"answer":1,"why":"Correct response: He established Twelver Shi'a Islam as the state religion, creating a distinct religious identity.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-063","stem":"Which statement best describes the political and social role of the Qizilbash in the early Safavid Empire?","options":["They were independent merchants who controlled the Persian silk trade.","They were enslaved infantry soldiers recruited through the Ottoman devshirme system.","They were religious scholars who had no military responsibilities.","They were powerful Turkic tribal warriors whose military support gave them political influence."],"answer":3,"why":"Correct response: They were powerful Turkic tribal warriors whose military support gave them political influence.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-064","stem":"What did the Battle of Chaldiran in 1514 demonstrate about warfare in the early modern period?","options":["Cavalry had become completely unnecessary in all military campaigns since everyone was using gunpowder.","Religious differences had no influence on conflict between empires.","Gunpowder weapons could give an army a significant advantage over cavalry forces.","The Safavids possessed more advanced artillery than the Ottomans."],"answer":2,"why":"Correct response: Gunpowder weapons could give an army a significant advantage over cavalry forces.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-065","stem":"Which reform best demonstrates how Shah Abbas I responded to earlier Safavid military weaknesses?","options":["He eliminated firearms and restored exclusive reliance on cavalry.","He transferred control of Safavid fortresses to the Mughal Empire.","He ended military recruitment outside the Qizilbash tribes.","He developed a standing army with musketeers and artillery."],"answer":3,"why":"Correct response: He developed a standing army with musketeers and artillery.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-066","stem":"Which comparison between the Qizilbash and Ottoman Janissaries is most accurate?","options":["Both were independent merchant organizations that financed military campaigns.","The Qizilbash were influential tribal cavalry warriors, while Janissaries were elite infantry serving the Ottoman ruler.","The Qizilbash were recruited through devshirme, while Janissaries were Persian tribal cavalry.","Both were hereditary religious leaders who controlled imperial law."],"answer":1,"why":"Correct response: The Qizilbash were influential tribal cavalry warriors, while Janissaries were elite infantry serving the Ottoman ruler.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-067","stem":"Why was Esfahan important during the reign of Shah Abbas I?","options":["It became the capital of the Ottoman Empire after Chaldiran.","It served primarily as a military camp without commercial importance.","It replaced the Persian Gulf as the empire's major maritime trading center.","It became a major center of Safavid government, trade, architecture, and Persian-Islamic culture."],"answer":3,"why":"Correct response: It became a major center of Safavid government, trade, architecture, and Persian-Islamic culture.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"safavid"},{"id":"assess7-068","stem":"Which comparison between the Safavid and Ottoman Empires is most accurate?","options":["Both established Hinduism as their official religion.","Both rejected gunpowder technology throughout their histories.","The Safavids promoted Twelver Shi'a Islam, while the Ottomans were predominantly Sunni Muslim.","The Safavids used the Ottoman millet system to organize all religious communities"],"answer":2,"why":"Correct response: The Safavids promoted Twelver Shi'a Islam, while the Ottomans were predominantly Sunni Muslim.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-069","stem":"What was the primary purpose of Akbar's Mansabdari System?","options":["To assign ranks and responsibilities to military and government officials","To organize Hindu religious communities into separate political territories","To divide the empire into hereditary kingdoms ruled by zamindars","To establish an independent military controlled by regional nobles"],"answer":0,"why":"Correct response: To assign ranks and responsibilities to military and government officials.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-070","stem":"What role did zamindars play in Mughal administration?","options":["They were local landholders and intermediaries who helped collect agricultural revenue.","They served as elite infantry soldiers recruited through devshirme.","They were religious leaders who enforced Sharia law throughout the empire.","They controlled the empire's international maritime trade.","They appointed the Mughal emperor and supervised the royal court."],"answer":0,"why":"Correct response: They were local landholders and intermediaries who helped collect agricultural revenue.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-071","stem":"Why did Akbar abolish the jizya tax?","options":["To reduce religious discrimination against non-Muslim subjects","To increase taxes on Hindu merchants exclusively","To replace all agricultural taxes with military service","To require non-Muslims to join the Mughal army"],"answer":0,"why":"Correct response: To reduce religious discrimination against non-Muslim subjects.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-072","stem":"What was Din-i-Ilahi (Divine Faith), introduced by Akbar in 1582?","options":["A military code that governed the Mughal cavalry","A Hindu religious movement that rejected all Islamic ideas and outlawed them.","A tax system used to organize agricultural revenue from different regions.","A small spiritual movement that drew ideas from different religious traditions"],"answer":3,"why":"Correct response: A small spiritual movement that drew ideas from different religious traditions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-073","stem":"Which statement best compares the political leadership of the Ottoman, Safavid, and Mughal Empires?","options":["The Ottomans were ruled by a shah, the Safavids by a sultan, and the Mughals by an emperor.","All three empires were governed by elected councils of religious leaders.","Ottomans were ruled by a sultan, the Safavids by a shah, and the Mughals by an emperor.","The Safavids and Mughals were governed by independent tribal confederations without central rulers."],"answer":2,"why":"Correct response: Ottomans were ruled by a sultan, the Safavids by a shah, and the Mughals by an emperor.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-074","stem":"Which statement correctly compares the dominant religious identities of the three Gunpowder Empires?","options":["All three empires officially promoted Twelver Shi'a Islam.","The Ottoman and Mughal ruling dynasties were Sunni Muslim, while the Safavids promoted Shi'a Islam.","The Ottomans and Safavids were predominantly Hindu, while the Mughals were Muslim.","The Safavids were Sunni, while the Ottomans and Mughals were Shi'a."],"answer":1,"why":"Correct response: The Ottoman and Mughal ruling dynasties were Sunni Muslim, while the Safavids promoted Shi'a Islam.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-075","stem":"Which statement best compares the Ottoman millet system with Akbar's policy of universal toleration?","options":["Both systems required religious minorities to adopt the ruler's religion while allowing limited freedom to maintain their cultural traditions.","Both permitted religious diversity, but the millet system granted recognized communities limited autonomy, while Akbar encouraged broader religious cooperation.","Both systems protected religious minorities by eliminating religious taxes and granting equal political rights to all subjects throughout their empires.","The millet system promoted Shi'a Islam among Ottoman subjects, while Akbar required Hindu communities to adopt Sunni Islamic religious practices."],"answer":1,"why":"Correct response: Both permitted religious diversity, but the millet system granted recognized communities limited autonomy, while Akbar encouraged broader religious cooperation.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-076","stem":"Which comparison between Suleyman I, Shah Isma'il I, and Akbar is most accurate?","options":["All three rulers rejected Islamic traditions and established secular governments.","Suleyman established Twelver Shi'a Islam, Isma'il promoted universal toleration, and Akbar enforced the Ottoman millet system.","All three rulers prohibited religious minorities from participating in economic activities.","Suleyman strengthened Ottoman law and government, Isma'il promoted Shi'a religious identity, and Akbar encouraged religious toleration."],"answer":3,"why":"Correct response: Suleyman strengthened Ottoman law and government, Isma'il promoted Shi'a religious identity, and Akbar encouraged religious toleration.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-077","stem":"Which statement correctly compares the military organization of the three Gunpowder Empires?","options":["The Ottomans used Janissaries, early Safavids relied on Qizilbash cavalry, and Mughals organized military ranks.","All three empires recruited their soldiers exclusively through devshirme.","The Safavids used Janissaries, while the Ottomans relied on Mughal zamindars.","The Mughal Empire rejected gunpowder weapons, unlike the Ottomans and Safavids."],"answer":0,"why":"Correct response: The Ottomans used Janissaries, early Safavids relied on Qizilbash cavalry, and Mughals organized military ranks.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-078","stem":"Why are the Ottoman, Safavid, and Mughal Empires collectively called the Gunpowder Empires?","options":["They invented gunpowder independently of earlier civilizations.","Their gunpowder weapons supported conquest and political control.","They prohibited traditional cavalry and infantry forces.","They used gunpowder exclusively for ceremonial celebrations."],"answer":1,"why":"Correct response: Their gunpowder weapons supported conquest and political control.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-079","stem":"Which comparison of cultural achievements is historically accurate?","options":["The Ottoman Empire developed monumental mosques such as the Süleymaniye Mosque, the Safavids transformed Esfahan into a major cultural center, and the Mughals constructed the Taj Mahal.","The Ottomans constructed the Taj Mahal, the Safavids built St. Petersburg, and the Mughals established the Forbidden City.","All three empires rejected architecture as a form of expressing political authority.","The Safavids constructed the Süleymaniye Mosque, while the Ottomans built the Taj Mahal."],"answer":0,"why":"Correct response: The Ottoman Empire developed monumental mosques such as the Süleymaniye Mosque, the Safavids transformed Esfahan into a major cultural center, and the Mughals constructed the Taj Mahal.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-080","stem":"How were the Ottoman devshirme system and the Russian Table of Ranks similar?","options":["Both allowed religious minorities to govern themselves independently.","Both were designed to eliminate the power of the monarchy.","Both required nobles to inherit their government positions.","Both helped rulers strengthen central authority by creating systems of government service."],"answer":3,"why":"Correct response: Both helped rulers strengthen central authority by creating systems of government service.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-081","stem":"Which statement best compares the policies of Tokugawa Japan and Qing China toward foreign trade?","options":["Both governments regulated foreign trade and restricted European access to their markets.","Japan established the Canton System, while China adopted the Closed Country policy.","Both governments completely prohibited all international trade.","Japan encouraged European settlement, while China encouraged European military alliances."],"answer":0,"why":"Correct response: Both governments regulated foreign trade and restricted European access to their markets.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-082","stem":"Which of the following best explains a major difference between the Ming and Qing dynasties of China?","options":["The Ming Dynasty was ruled by Mongols, while the Qing Dynasty was ruled by the Han Chinese.","The Ming Dynasty promoted Christianity, while the Qing Dynasty established Buddhism as the official religion.","The Ming Dynasty eliminated the civil service examination system, while the Qing Dynasty introduced it.","The Ming Dynasty was established by the Han Chinese, while the Qing Dynasty was established by the Manchus, who maintained a distinct cultural identity."],"answer":3,"why":"Correct response: The Ming Dynasty was established by the Han Chinese, while the Qing Dynasty was established by the Manchus, who maintained a distinct cultural identity.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-083","stem":"How did political and economic power change in parts of West Africa as post-classical states declined?","options":["European governments immediately replaced African rulers throughout the interior.","New African states stopped expanding because overseas trade made territory unnecessary.","Long-distance trade largely disappeared and African states became more isolated.","Atlantic trade became more important, helping some newer states increase their military and political strength."],"answer":3,"why":"Correct response: Atlantic trade became more important, helping some newer states increase their military and political strength.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-084","stem":"Queen Nzinga sought help from which European rival of Portugal?","options":["English","Spanish","Dutch","French"],"answer":2,"why":"Correct response: Dutch.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-085","stem":"Which African kingdom developed significant diplomatic and trading ties with Portugal?","options":["Benin","Kongo","Oyo","Asante"],"answer":1,"why":"Correct response: Kongo.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-086","stem":"Which African ruler used conversion to Catholicism as part of her diplomacy with the Portuguese?","options":["Queen Nzinga","Po'pay","Tupac Amaru II","King Joao III"],"answer":0,"why":"Correct response: Queen Nzinga.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-087","stem":"What was one effect of the Atlantic Slave Trade on gender roles in West Africa?","options":["European traders required women to hold equal positions in African governments.","The loss of many men led women in some communities to take on more economic and social responsibilities.","The removal of women from Africa caused men to assume nearly all household work.","Imported European food caused women to leave agricultural work almost completely."],"answer":1,"why":"Correct response: The loss of many men led women in some communities to take on more economic and social responsibilities.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-088","stem":"Which sequence correctly shows the transition from Yuan to Ming rule?","options":["Yuan weakness -> Red Turban Rebellion -> Hongwu defeats rivals -> Ming Dynasty","Red Turban Rebellion -> Mongol conquest of China -> Hongwu creates Yuan Dynasty","Hongwu becomes emperor -> Yuan expansion -> Red Turban Rebellion","Yuan weakness -> Hongwu defends Mongol rule -> Red Turbans create Ming Dynasty"],"answer":0,"why":"Correct response: Yuan weakness -> Red Turban Rebellion -> Hongwu defeats rivals -> Ming Dynasty.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-089","stem":"What common goal connected the Pueblo Revolt, slave revolts, Maroon communities, and Queen Nzinga's resistance?","options":["Creating alliances with Portugal to strengthen local governments","Resisting outside domination, forced labor, enslavement, or colonial expansion","Restoring the same post-classical African empire across several continents","Taking control of Atlantic shipping routes from European merchants"],"answer":1,"why":"Correct response: Resisting outside domination, forced labor, enslavement, or colonial expansion.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-090","stem":"How did the Ming tribute system generally work?","options":["Foreign governments supplied silver to finance Ming colonies throughout the Indian Ocean.","Foreign rulers acknowledged the Chinese emperor and offered tribute in return for diplomatic and trading opportunities.","Chinese farmers sent part of each harvest to foreign states in exchange for military defense.","European merchants paid Japanese daimyo before receiving access to Chinese markets."],"answer":1,"why":"Correct response: Foreign rulers acknowledged the Chinese emperor and offered tribute in return for diplomatic and trading opportunities.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-091","stem":"What helped states such as Asante and Oyo become more powerful in the early modern era?","options":["They abandoned long-distance trade and relied mostly on local farming.","European monarchs took direct control of their governments and expanded their borders.","They stopped fighting neighboring states and formed a permanent regional alliance.","Profits from expanding trade helped them build stronger armies and governments."],"answer":3,"why":"Correct response: Profits from expanding trade helped them build stronger armies and governments.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-092","stem":"Which description best fits a Maroon society?","options":["A European merchant community established along the African coast","An independent community formed by people who escaped slavery","An alliance of African rulers organized to supply captives to European traders","A Spanish-controlled Indigenous labor settlement"],"answer":1,"why":"Correct response: An independent community formed by people who escaped slavery.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-093","stem":"How did Hongwu help create the Ming Dynasty?","options":["He defended the Yuan Dynasty by defeating the Red Turban rebels.","He joined resistance to Yuan rule, defeated competing leaders, and became the first Ming emperor.","He invited Portuguese forces to remove the Mongols from China.","He restored Mongol control after defeating Chinese rebel groups."],"answer":1,"why":"Correct response: He joined resistance to Yuan rule, defeated competing leaders, and became the first Ming emperor.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-094","stem":"What role did Mandarin play in the Ming government?","options":["It was a new religion that replaced Confucianism in the imperial government.","It was created so Chinese merchants could negotiate specifically with Portuguese traders.","It served as a common language used in government and administration across different regions.","It was restricted to peasants and was generally avoided by government officials."],"answer":2,"why":"Correct response: It served as a common language used in government and administration across different regions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-095","stem":"Which Ming achievement was designed to gather and preserve a vast amount of Chinese knowledge?","options":["The tribute system","The Yongle Encyclopedia","The Single-Whip tax system","Zheng He's treasure fleet"],"answer":1,"why":"Correct response: The Yongle Encyclopedia.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-096","stem":"Which Spanish colonial policies helped provoke the Pueblo Revolt of 1680?","options":["A requirement that Pueblo peoples participate in Atlantic plantation trade","Suppression of Pueblo religion, forced labor, and colonial control","The replacement of Pueblo farming with sugar plantations throughout New Mexico","A Spanish plan to move Pueblo communities permanently to the Atlantic coast"],"answer":1,"why":"Correct response: Suppression of Pueblo religion, forced labor, and colonial control.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-097","stem":"Which set of policies or practices most clearly helped the Ming strengthen centralized government?","options":["Independent regional governments, the end of taxation, and elimination of civil service","Foreign control of provincial governments and locally created legal systems","European management of tax collection and the abolition of the tribute system","Confucian administration, a shared government language, and more standardized taxation"],"answer":3,"why":"Correct response: Confucian administration, a shared government language, and more standardized taxation.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-098","stem":"What was an important change created by the Ming Single-Whip tax reform?","options":["Multiple taxes and labor duties were consolidated into payments increasingly collected in silver.","Every social class paid exactly the same amount regardless of land or wealth.","Taxes were abolished and replaced entirely by military service.","Foreign merchants were required to pay all taxes using Chinese manufactured goods."],"answer":0,"why":"Correct response: Multiple taxes and labor duties were consolidated into payments increasingly collected in silver.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-099","stem":"How did Confucianism shape Ming government and society?","options":["It was rejected because Ming rulers associated it exclusively with Mongol Yuan rule.","It became a missionary faith that Ming rulers attempted to spread through overseas conversion.","It influenced education, government service, social hierarchy, and expectations for officials.","It caused Ming rulers to abolish the civil service examination system."],"answer":2,"why":"Correct response: It influenced education, government service, social hierarchy, and expectations for officials.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-100","stem":"What was an important population effect of the Atlantic Slave Trade on West Africa?","options":["Large numbers of European settlers moved into West Africa and caused rapid population growth.","People became evenly spread across the region as coastal settlements disappeared.","West Africa became much older because almost all people taken were young children.","The forced removal of millions of people disrupted communities and changed population patterns."],"answer":3,"why":"Correct response: The forced removal of millions of people disrupted communities and changed population patterns.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-101","stem":"Why are some African states of this period called slave-raiding states?","options":["They conquered neighboring societies mainly to end slavery and recruit freed captives.","They created colonies in the Americas to manage the plantation system.","They invited European armies to capture people independently inside their kingdoms.","They sent armies into neighboring areas, captured people, and sold some captives into Atlantic slavery."],"answer":3,"why":"Correct response: They sent armies into neighboring areas, captured people, and sold some captives into Atlantic slavery.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-102","stem":"Which grievance helped cause the rebellion led by Tupac Amaru II?","options":["A plan to replace Indigenous religion with Protestantism","A desire to build an independent Atlantic merchant empire","Spanish colonial taxes and abusive labor demands","A Portuguese ban on trade with African kingdoms"],"answer":2,"why":"Correct response: Spanish colonial taxes and abusive labor demands.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-103","stem":"Which African state arose in the region that is now Ghana?","options":["Kongo","Oyo","Asante","Benin"],"answer":2,"why":"Correct response: Asante.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-104","stem":"Why did so much silver flow into Ming China?","options":["China controlled nearly every silver mine in the world and banned silver exports.","China used silver only for foreign purchases and prohibited its use inside the empire.","Chinese demand for silver taxes and foreign demand for Chinese goods drew global silver into China.","The tribute system required every foreign country to send mined silver to Beijing."],"answer":2,"why":"Correct response: Chinese demand for silver taxes and foreign demand for Chinese goods drew global silver into China.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-105","stem":"Which conditions made the Middle Passage especially deadly?","options":["Requirements that captives manufacture plantation goods during the voyage","Frequent naval battles between African kingdoms in the middle of the Atlantic","A lack of sailors who knew how to navigate between Europe and the Americas","Crowded ships, disease, inadequate food and water, and violent treatment"],"answer":3,"why":"Correct response: Crowded ships, disease, inadequate food and water, and violent treatment.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-106","stem":"Where did Zheng He's major Ming voyages travel?","options":["Mostly to Korea and Japan as part of a campaign of permanent conquest","Across the Indian Ocean to places such as Southeast Asia, India, Arabia, and East Africa","Across the Atlantic Ocean to establish Chinese colonies in West Africa","Primarily through inland Chinese rivers to improve domestic transportation"],"answer":1,"why":"Correct response: Across the Indian Ocean to places such as Southeast Asia, India, Arabia, and East Africa.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-107","stem":"Which pair of African states developed in areas that are now part of Nigeria?","options":["Kongo and Asante","Asante and Kongo","Oyo and Benin","Benin and Kongo"],"answer":2,"why":"Correct response: Oyo and Benin.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-108","stem":"Which feature most clearly distinguishes chattel slavery from many earlier systems of slavery?","options":["Every enslaved person automatically became free after a fixed period of labor.","Enslaved people were considered legal property, and their status could pass to their children.","Enslavement always ended after a person's debt had been repaid.","Enslaved people could serve in armies but could never be bought or sold."],"answer":1,"why":"Correct response: Enslaved people were considered legal property, and their status could pass to their children.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-109","stem":"Which country’s geography gave it a distinct advantage at the start of the Age of Exploration?","options":["The Netherlands","Great Britain","France","Portugal","Spain"],"answer":3,"why":"Correct response: Portugal.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-110","stem":"Which feature was especially important to the Dutch maritime empire?","options":["Joint-stock companies and naval fleets controlled major trade routes.","Large armies conquered inland kingdoms throughout South America.","Settler colonies supplied most of the empire's manufactured goods.","Religious missionaries controlled most of the empire's trading ports.","Plantation owners controlled the Dutch government's overseas trade."],"answer":0,"why":"Correct response: Joint-stock companies and naval fleets controlled major trade routes.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-111","stem":"Which economic activity was especially important to the French empire?","options":["Fur trading, sugar plantations, and Atlantic commerce","Silver mining, gold trading, and Pacific commerce","Spice trading, banking, and Indian Ocean shipping","Industrial manufacturing, oil production, and Atlantic shipping","Cotton plantations, silver mining, and Mediterranean commerce"],"answer":0,"why":"Correct response: Fur trading, sugar plantations, and Atlantic commerce.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-112","stem":"What did Portugal, the Netherlands, and England have in common?","options":["All three focused primarily on conquering inland American empires.","All three used maritime power to support overseas trade and expansion.","All three avoided using companies to organize overseas commerce.","All three focused mainly on silver mining and plantation agriculture.","All three established their largest colonies in South America."],"answer":1,"why":"Correct response: All three used maritime power to support overseas trade and expansion.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-113","stem":"Where did Vodou develop as a major religious tradition?","options":["Cuba","Haiti","Jamaica","Brazil","Mexico"],"answer":1,"why":"Correct response: Haiti.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-114","stem":"Which statement best explains the relationship between mercantilism and exploration?","options":["Mercantilism discouraged exploration because overseas trade was not profitable.","Mercantilism encouraged exploration because countries wanted new resources and markets.","Mercantilism caused European countries to stop competing for overseas territories.","Mercantilism encouraged explorers to avoid valuable trade routes and ports.","Mercantilism caused European countries to focus only on trade within Europe."],"answer":1,"why":"Correct response: Mercantilism encouraged exploration because countries wanted new resources and markets.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-115","stem":"How did King Afonso I of Kongo respond to Portuguese involvement in the slave trade?","options":["He rejected Christianity and demanded the immediate withdrawal of Portuguese missionaries.","He encouraged unrestricted slave trading to strengthen Kongo's political and military power.","He sought Portuguese cooperation while protesting the unlawful enslavement of his subjects.","He ended diplomatic relations and prohibited all European trade within Kongo's borders.","He transferred political authority to Portuguese officials to regulate the slave trade."],"answer":2,"why":"Correct response: He sought Portuguese cooperation while protesting the unlawful enslavement of his subjects.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"africa"},{"id":"assess7-116","stem":"What distinguished chattel slavery in the Atlantic Slave Trade?","options":["Enslaved individuals served temporarily before gaining freedom through military service.","Enslaved individuals were treated as property, with their status generally inherited.","Enslaved individuals retained legal independence while providing labor through taxation.","Enslaved individuals worked under contracts that guaranteed eventual legal emancipation.","Enslaved individuals maintained citizenship while completing compulsory agricultural labor."],"answer":1,"why":"Correct response: Enslaved individuals were treated as property, with their status generally inherited.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-117","stem":"What was a major cause of the Pueblo Revolt?","options":["Spanish restrictions on trade between Indigenous communities and neighboring colonies","Spanish efforts to recruit Indigenous warriors for military campaigns overseas","Spanish interference with Indigenous religious practices and traditional ways of life","Spanish attempts to replace Indigenous agriculture with plantation-based production","Spanish demands that Indigenous leaders surrender control of regional trade routes"],"answer":2,"why":"Correct response: Spanish interference with Indigenous religious practices and traditional ways of life.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-118","stem":"What motivated Túpac Amaru II's rebellion against Spanish rule?","options":["Opposition to Portuguese settlement and missionary activity along the Andean coast","Opposition to colonial exploitation, forced labor, and excessive taxation in Peru","Opposition to British commercial expansion and military occupation in the Andes","Opposition to Indigenous alliances with European merchants throughout South America","Opposition to French territorial expansion and plantation development in South America"],"answer":1,"why":"Correct response: Opposition to colonial exploitation, forced labor, and excessive taxation in Peru.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-119","stem":"How did Queen Nzinga resist Portuguese expansion in Central Africa?","options":["She organized military alliances and negotiated diplomatically to defend her kingdoms.","She accepted Portuguese authority while demanding greater control over coastal trade.","She encouraged Portuguese settlement while restricting European religious influence.","She established overseas colonies and challenged Portuguese control of Atlantic shipping.","She surrendered military authority while maintaining control of regional trade networks."],"answer":0,"why":"Correct response: She organized military alliances and negotiated diplomatically to defend her kingdoms.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-120","stem":"What was a significant effect of resistance movements in Africa and the Americas?","options":["They permanently ended European expansion throughout Africa and the Americas.","They eliminated colonial labor systems across most European-controlled territories.","They established unified governments representing Indigenous and African populations.","They forced European governments to abandon overseas commercial relationships.","They challenged colonial authority and sometimes secured autonomy or temporary independence."],"answer":4,"why":"Correct response: They challenged colonial authority and sometimes secured autonomy or temporary independence.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"resistance"},{"id":"assess7-121","stem":"Which statement accurately describes Ming achievements under the Yongle Emperor?","op
