e":"world","modules":["russia","global","ottoman"],"intro":"Pushkin wrote The Bronze Horseman in the nineteenth century; the curriculum names this poem as OPTIONAL evidence about Peter the Great’s legacy.","dilemma":"How should a historian use a poem written after Peter the Great’s reign?","choices":[{"label":"Treat it as later cultural interpretation, not a firsthand report from Peter’s court","effect":"Its date and literary purpose shape what it can reveal."},{"label":"Treat it as a diary Peter wrote himself","effect":"Pushkin wrote long after Peter died."},{"label":"Use it to establish Tokugawa policies in 1600","effect":"Its context is Russian literary history."}],"bridge":"Peter I → St. Petersburg → memory of reform","later":true,"optional":true,"real":true},{"id":"voc","name":"VOC Trading Captain","role":"Composite merchant viewpoint","unit":1,"where":"Indian Ocean and Java","when":"c. 1620","archive":"ships","modules":["maritime","ming","tokugawa"],"intro":"This representative captain is fictional; the VOC was a real Dutch joint-stock company and entered established Asian trading networks.","dilemma":"Your company wants access to profitable markets. What historical reality must a captain consider?","choices":[{"label":"Established Asian commercial networks and political authorities","effect":"Trade already existed; Europeans negotiated and contested access."},{"label":"Asia had no merchants before 1600","effect":"Indian Ocean and East Asian networks long predated the VOC."},{"label":"Europeans controlled every Asian port","effect":"The VOC had influence and coercive power but not universal control."}],"bridge":"VOC → Ming silver → Japanese restrictions","later":false,"optional":false,"real":false},{"id":"portugal","name":"Portuguese Navigator","role":"Composite seafaring viewpoint","unit":1,"where":"Atlantic to Indian Ocean","when":"c. 1500","archive":"ships","modules":["exploration","maritime","ming"],"intro":"This fictional navigator represents Portuguese expeditions entering established Indian Ocean routes around the Cape of Good Hope.","dilemma":"Which route and trade realities should be recognized?","choices":[{"label":"Round southern Africa and encounter existing trade networks","effect":"This matches Portugal’s maritime pathway to India and older regional commerce."},{"label":"Sail directly from Lisbon to the Moon","effect":"That is not a historical route."},{"label":"Assume Portugal invented the Indian Ocean market","effect":"Old routes and ports existed long before Portuguese arrivals."}],"bridge":"Cape of Good Hope → cartaz → Mughal India","later":false,"optional":false,"real":false},{"id":"merchant","name":"Indian Ocean Merchant","role":"Composite local merchant viewpoint","unit":1,"where":"Western Indian Ocean","when":"c. 1550","archive":"ships","modules":["maritime","mughal","ming"],"intro":"This fictional merchant represents longstanding Indian Ocean commercial communities before and after European armed expansion.","dilemma":"Which evidence would help explain disruptions to trade?","choices":[{"label":"Cartaz enforcement, port policy and local trading records","effect":"These show how commerce could be regulated and contested."},{"label":"Only Spanish silver mined centuries later","effect":"Later silver flows alone cannot explain early local maritime controls."},{"label":"Assume all merchants responded identically","effect":"Responses differed among ports, rulers and merchant communities."}],"bridge":"Asian networks → Portuguese cartaz → Ming trade","later":false,"optional":false,"real":false},{"id":"maroon","name":"Maroon Community Organizer","role":"Composite resistance perspective","unit":2,"where":"Caribbean and Americas","when":"1600s","archive":"world","modules":["resistance","labor","africa"],"intro":"This fictional community representative introduces the real history of people who escaped slavery and formed self-governing communities.","dilemma":"What is an appropriate way to investigate the community’s history?","choices":[{"label":"Study self-government, defense, cultural life and sources from varied perspectives","effect":"This keeps freedom and agency at the center of the inquiry."},{"label":"Treat enslaved people only as cargo in trade diagrams","effect":"That erases experiences, agency and human dignity."},{"label":"Assume every Maroon settlement was identical","effect":"Maroons formed many distinct communities across the Americas."}],"bridge":"Middle Passage → freedom struggles → Nzinga","later":false,"optional":false,"real":false}],"archive":[{"id":"world","title":"World map by Frederik de Wit","date":"c. 1670s","type":"Historical map","note":"A genuine seventeenth-century map. Its geography and place labels reflect the cartographer’s knowledge and assumptions; not a modern reference map.","file":"17th century world map - Nova Totius Terrarum Orbis Tabula.jpg","credit":"Frederik de Wit, 17th-century world map; Wikimedia Commons, public domain.","page":"https://commons.wikimedia.org/wiki/File:17th_century_world_map_-_Nova_Totius_Terrarum_Orbis_Tabula.jpg"},{"id":"ships","title":"The Return of the Fleet of the VOC","date":"17th century","type":"Period painting","note":"Historical maritime painting, not a photograph or a depiction of our fictional student captain.","file":"The Return of the Fleet of the Dutch East India Company (Louvre, INV 987).jpg","credit":"VOC fleet painting, Louvre; Wikimedia Commons, public-domain artwork.","page":"https://commons.wikimedia.org/wiki/File:The_Return_of_the_Fleet_of_the_Dutch_East_India_Company_(Louvre,_INV_987).jpg"},{"id":"nzinga","title":"Ann Zingha","date":"1830s","type":"Later lithograph","note":"A nineteenth-century artistic depiction of Nzinga, made long after her life. It is not a contemporary portrait.","file":"Ann Zingha.jpg","credit":"Achille Devéria, 1830s hand-colored lithograph; Wikimedia Commons.","page":"https://commons.wikimedia.org/wiki/File:Ann_Zingha.jpg"},{"id":"zheng","title":"Zheng He in a c. 1600 publication","date":"c. 1600","type":"Later illustration","note":"Published roughly two centuries after Zheng He’s voyages, in a fictionalized account; useful for evaluating historical memory rather than exact likeness.","file":"Portrait of Zheng He, published about 1600.jpg","credit":"Illustration published about 1600 in a fictionalized account of Zheng He’s voyages; Wikimedia Commons, public domain.","page":"https://commons.wikimedia.org/wiki/File:Portrait_of_Zheng_He,_published_about_1600.jpg"},{"id":"popay","title":"Po’pay commemorative statue","date":"Modern monument","type":"Photo of memorial","note":"Sculpture by Pueblo artist Cliff Fragua. It is a modern memorial, not a seventeenth-century likeness.","file":"U.S. Capitol Po’pay Statue.jpg","credit":"Photograph of Cliff Fragua’s Po’pay statue; see Wikimedia Commons page for photographer and license.","page":"https://commons.wikimedia.org/wiki/File:U.S._Capitol_Po’pay_Statue.jpg"},{"id":"taj","title":"Taj Mahal","date":"2010 photo","type":"Modern site photograph","note":"Photograph of a real Mughal monument constructed under Shah Jahan, not during the reign of Akbar.","file":"Taj-Mahal CC0.jpg","credit":"Simon Steinberger, Taj Mahal photograph (2010), CC0; Wikimedia Commons.","page":"https://commons.wikimedia.org/wiki/File:Taj-Mahal_CC0.jpg"},{"id":"suleyman","title":"Portrait of Suleyman I","date":"16th century","type":"Period portrait","note":"Historical European workshop portrait associated with the circle of Titian; unlike a photograph, it is an artistic representation.","file":"Suleiman the Magnificent of the Ottoman Empire.jpg","credit":"Circle of Titian, sixteenth-century portrait of Suleyman I; Wikimedia Commons, public-domain artwork.","page":"https://commons.wikimedia.org/wiki/File:Suleiman_the_Magnificent_of_the_Ottoman_Empire.jpg"}],"version":"DRAFT 1.0","compiled":"2026-10-25"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('game-data').textContent);
const byId=(id)=>document.getElementById(id);
const modules=DATA.modules,characters=DATA.characters,archive=DATA.archive;
const qIndex=Object.fromEntries(modules.flatMap(m=>m.questions.map(q=>[q.id,q])));
const mIndex=Object.fromEntries(modules.map(m=>[m.id,m]));
const cIndex=Object.fromEntries(characters.map(p=>[p.id,p]));
const aIndex=Object.fromEntries(archive.map(a=>[a.id,a]));
const imgUrl=(a)=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(a.file)+'?width=960';
const esc=(v)=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const el=(tag,klass,txt)=>`<${tag}${klass?` class="${klass}"`:''}>${esc(txt)}</${tag}>`;
function load(){try{return JSON.parse(localStorage.getItem('cw_h7_progress_d1')||'{}')}catch(e){return {}}}
let saved=load();let completed=new Set(saved.completed||[]);let peopleDone=new Set(saved.peopleDone||[]);let connectionDone=new Set(saved.connections||[]);
let screen={view:'home',id:null,idx:0,wrong:null,solved:false,chosen:null,hint:false,filter:'all',search:'',unit:'all',mapPin:'Atlantic',sequence:[],classify:{},sourceFocus:0};
const totalQuestions=modules.reduce((n,m)=>n+m.questions.length,0);
function save(){try{localStorage.setItem('cw_h7_progress_d1',JSON.stringify({completed:[...completed],peopleDone:[...peopleDone],connections:[...connectionDone]}))}catch(e){}}
function setScreen(view,id=null,extra={}){screen={...screen,view,id,idx:0,wrong:null,solved:false,chosen:null,hint:false,...extra};render();window.scrollTo({top:0,behavior:'auto'});}
function imageTag(a,cls='',alt=''){if(!a)return '';return `<img class="${cls}" src="${imgUrl(a)}" alt="${esc(alt||a.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('img-fallback')">`;}
function imgCard(a,height=''){return `<figure class="source-pic" style="margin:0">${imageTag(a,'',a.title)}<figcaption><b>${esc(a.title)}</b> · ${esc(a.date)} · ${esc(a.type)}. ${esc(a.note)} <a target="_blank" rel="noopener noreferrer" href="${esc(a.page)}">Source ↗</a></figcaption></figure>`;}
function headline(eyebrow,title,description){return `<section class="section"><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2><p class="subtle">${esc(description)}</p></section>`;}
function cardImage(a){return `<div class="art">${imageTag(a,'',a.title)}<span class="art-label">${esc(a.type)} · ${esc(a.date)}</span></div>`}
function bar(){const n=completed.size;return `<div class="stats"><div class="stat"><strong>${n} / ${totalQuestions}</strong><small>Questions mastered</small><div class="progressbar"><span style="width:${Math.round(n/totalQuestions*100)}%"></span></div></div><div class="stat"><strong>${peopleDone.size} / ${characters.length}</strong><small>Perspectives completed</small></div><div class="stat"><strong>${connectionDone.size}</strong><small>World connections discovered</small></div></div>`}
function navButton(action,label,cls='secondary',arg=''){return `<button class="btn ${cls}" data-action="${esc(action)}"${arg?` data-id="${esc(arg)}"`:''}>${esc(label)}</button>`}
function home(){const heroImg=imgUrl(aIndex.ships);return `<div class="hero" style="--heroImg:url('${heroImg}')"><div class="hero-content"><div class="eyebrow">ONE WORLD · MANY PERSPECTIVES · THREE UNITS</div><h1 class="display">THE <span class="gold">CONNECTED</span><br>WORLD</h1><p>Become a navigator, a ruler, an organizer of resistance, or an imperial adviser. Follow routes and decisions across a world transformed by trade, power and exchange.</p><div class="actions">${navButton('map','Explore the world','')}${navButton('people','Choose a historical figure')}${navButton('modules','Review every objective','minor')}</div><p class="small" style="color:#e0d1b2">1450–1750 is our central period. Earlier foundations and later consequences are clearly labeled.</p></div></div>${bar()}<section class="section"><div class="section-head"><div><div class="eyebrow">BEGIN YOUR JOURNEY</div><h2>Explore by perspective or topic</h2><p class="subtle">You can travel freely. Every required topic also has its own review deck, so character choice never limits exam preparation.</p></div></div><div class="grid"><article class="card"><div class="card-inner"><div class="eyebrow">01 · People</div><h3>Choose someone to follow</h3><p>${characters.filter(p=>p.real).length} named historical figures plus 4 labeled composite viewpoints. Individual evidence challenges and connections await.</p>${navButton('people','Browse perspectives','small')}</div></article><article class="card"><div class="card-inner"><div class="eyebrow">02 · Places</div><h3>Follow the world map</h3><p>Navigate oceans, ports and courts. Every region leads to real events, connected figures and review topics.</p>${navButton('map','Open the map','small')}</div></article><article class="card"><div class="card-inner"><div class="eyebrow">03 · Preparation</div><h3>Master the review</h3><p>${totalQuestions} comprehension checks across 12 curriculum decks plus one global-connections challenge. No grades or submissions.</p>${navButton('modules','See review decks','small')}</div></article></div></section><section class="section"><div class="grid two"><div class="panel"><div class="eyebrow">COMMON THREAD · THE OCEANS</div><h3>Trade connected places—and changed lives.</h3><p>Trace the Portuguese cartaz, Kongo diplomacy, Ming silver taxes, Tokugawa regulations, Ottoman commercial power and colonial labor systems as parts of overlapping global processes.</p>${navButton('module','Start with maritime empires','secondary','maritime')}</div><div class="panel"><div class="eyebrow">SOURCE LENS</div><h3>What does an image really tell us?</h3><p>We use real historical maps, artworks, photographs and memorials. A portrait painted centuries later is labeled differently from a period document.</p>${navButton('archive','Open primary & visual sources','secondary')}</div></div></section>`;}
function peopleView(){const choicesUnit=['all','1','2','3'];let matches=characters.filter(p=>(screen.unit==='all'||String(p.unit)===screen.unit)&&(screen.filter==='all'||(screen.filter==='named'&&p.real)||(screen.filter==='composite'&&!p.real))&&(!screen.search||(`${p.name} ${p.where} ${p.role} ${p.intro}`).toLowerCase().includes(screen.search.toLowerCase())));return `${headline('CHARACTER GALLERY','Choose your historical identity','Every named person in the Units 1–3 curriculum has a playable perspective; the four representative roles are explicitly fictional.')}<div class="note">Characters lived in different centuries. Selecting one does not mean every other figure was their contemporary. Your character is a lens for investigation, not a replacement for historical evidence.</div><div class="filters"><label class="sr" for="unitFilter">Filter by unit</label><select id="unitFilter" class="select"><option value="all" ${screen.unit==='all'?'selected':''}>All units</option><option value="1" ${screen.unit==='1'?'selected':''}>Unit 1</option><option value="2" ${screen.unit==='2'?'selected':''}>Unit 2</option><option value="3" ${screen.unit==='3'?'selected':''}>Unit 3</option></select><label class="sr" for="kindFilter">Filter type</label><select id="kindFilter" class="select"><option value="all">All perspectives</option><option value="named" ${screen.filter==='named'?'selected':''}>Named historical figures</option><option value="composite" ${screen.filter==='composite'?'selected':''}>Representative roles</option></select><input class="search" id="personSearch" type="search" placeholder="Search a name or region…" value="${esc(screen.search)}" aria-label="Search perspectives"/></div><div class="small muted" style="margin-bottom:12px">Showing ${matches.length} perspectives · ✓ means that character’s evidence journey is complete</div><div class="grid">${matches.map(p=>{const a=aIndex[p.archive]||aIndex.world;return `<article class="card">${cardImage(a)}<div class="card-inner"><div class="tag">${p.real?'Historical figure':'Fictional representative'} · Unit ${p.unit}</div><h3>${esc(p.name)} ${peopleDone.has(p.id)?'<span title="Journey complete">✓</span>':''}</h3><p class="small muted">${esc(p.role)} · ${esc(p.where)} · ${esc(p.when)}</p>${p.later?`<span class="unit-pill">${p.optional?'OPTIONAL · ':''}Timeline note</span>`:''}<p>${esc(p.intro)}</p><div class="card-foot"><span class="small">${esc(p.modules.map(id=>mIndex[id].tag).join(' · '))}</span>${navButton('person','Enter story →','small',p.id)}</div></div></article>`}).join('')}</div>${matches.length?'':'<div class="empty">No characters match that search.</div>'}`;}
function personJourney(p){const a=aIndex[p.archive]||aIndex.world;const qs=missionQs(p),q=qs[screen.idx];const phase=screen.solved?'solved':'ask';return `<div class="crumb"><button data-action="people">← All characters</button> / Unit ${p.unit} / ${esc(p.name)}</div><div class="split"><div><div class="eyebrow">HISTORICAL PERSPECTIVE · ${p.real?'NAMED FIGURE':'COMPOSITE ROLE'}</div><h2 style="font-size:clamp(2rem,4vw,3.1rem);margin-bottom:8px">${esc(p.name)}</h2><div class="small muted">${esc(p.where)} · ${esc(p.when)}</div>${p.later?`<div class="note warning"><b>Timeline marker:</b> This figure or event lies partly or wholly outside the core 1450–1750 period. We include it because it appears in the curriculum or its supporting materials.</div>`:''}<p class="script">${esc(p.intro)}</p><div class="note">This is an evidence-based learning scenario—not a transcript of anything the person actually said or a claim that you can rewrite history.</div><div class="rule"></div><div class="eyebrow">YOUR HISTORICAL DILEMMA</div><h3>${esc(p.dilemma)}</h3>${p.choices.map((ch,i)=>`<button class="choice ${screen.chosen===i?'selected':''}" data-action="choose" data-n="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(ch.label)}</button>`).join('')}${screen.chosen!==null?`<div class="feedback" role="status">${esc(p.choices[screen.chosen].effect)}</div><div class="actions">${navButton('start-mission','Continue to comprehension checks','',p.id)}<button class="btn secondary" data-action="clear-choice">Compare another choice</button></div>`:''}</div><aside><div class="source-pic">${imageTag(a,'',a.title)}<figcaption>${esc(a.title)} · ${esc(a.type)} · ${esc(a.date)}. <a href="${esc(a.page)}" target="_blank" rel="noopener noreferrer">Image source ↗</a></figcaption></div><div class="panel" style="margin-top:18px"><div class="eyebrow">CONNECTIONS TO DISCOVER</div><p>${esc(p.bridge)}</p><div class="progressbar"><span style="width:${peopleDone.has(p.id)?100:0}%"></span></div><p class="small muted">Three comprehension checks follow the dilemma. Those questions also count toward the shared review.</p></div></aside></div>`}
function missionQs(p){let chosen=[];for(let i=0;i<3;i++){let m=mIndex[p.modules[i%p.modules.length]];let hash=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);let q=m.questions[(hash+i*3)%m.questions.length];if(chosen.some(x=>x.id===q.id)){q=m.questions[(hash+i*3+1)%m.questions.length]}chosen.push(q)}return chosen;}
function startMission(p){screen.view='mission';screen.id=p.id;screen.idx=0;screen.wrong=null;screen.solved=false;screen.hint=false;render()}
function renderMission(p){const qs=missionQs(p);const q=qs[screen.idx];return `<div class="crumb"><button data-action="person" data-id="${p.id}">← ${esc(p.name)}</button> / Evidence mission / Question ${screen.idx+1} of ${qs.length}</div><div class="eyebrow">PERSPECTIVE MISSION · ${esc(p.name)}</div><h2>What does the evidence show?</h2><p class="subtle">Each check is part of the shared curriculum bank. Try again after feedback; there are no penalties.</p><div class="review-index">${qs.map((q,i)=>`<button class="dot ${completed.has(q.id)?'done':''} ${screen.idx===i?'current':''}" data-action="mission-index" data-n="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div>${qCard(q,'mission',qs.length)}<div class="note"><b>Cross-unit trail:</b> ${esc(p.bridge)} · After the questions, follow another character or topic to compare perspectives.</div>`}
function moduleCards(){return `${headline('EXAM PREPARATION','Curriculum review decks','There is no route that can skip required material: these decks cover Unit 1, Unit 2, Unit 3 and explicit cross-unit reasoning.')}${bar()}<div class="grid">${modules.map(m=>{let done=m.questions.filter(q=>completed.has(q.id)).length;return `<article class="card"><div class="card-inner"><span class="unit-pill">${m.unit?'UNIT '+m.unit:'GLOBAL CONNECTIONS'}</span><h3>${esc(m.name)}</h3><p>${esc(m.description)}</p><div class="small muted">${done} of ${m.questions.length} checks mastered</div><div class="progressbar"><span style="width:${done/m.questions.length*100}%"></span></div><div class="card-foot"><span class="small muted">${esc(m.region)}</span>${navButton('module','Open deck →','small',m.id)}</div></div></article>`}).join('')}</div>`;}
function moduleView(m){const q=m.questions[screen.idx];let done=m.questions.filter(x=>completed.has(x.id)).length;return `<div class="crumb"><button data-action="modules">← Review decks</button> / ${m.unit?'Unit '+m.unit:'Global'} / ${esc(m.name)}</div><div class="eyebrow">${m.unit?'UNIT '+m.unit:'SYNTHESIS'} · ${esc(m.region)}</div><h2>${esc(m.name)}</h2><p class="subtle">${esc(m.description)}</p><div class="panel"><div class="small muted">${done} of ${m.questions.length} checks mastered</div><div class="progressbar"><span style="width:${done/m.questions.length*100}%"></span></div><div class="review-index">${m.questions.map((x,i)=>`<button class="dot ${completed.has(x.id)?'done':''} ${i===screen.idx?'current':''}" data-action="deck-index" data-n="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div></div>${qCard(q,'module',m.questions.length)}<div class="note"><b>Cross-unit links:</b> ${m.connections.map(id=>`<button class="btn small minor" style="margin:3px" data-action="module" data-id="${id}">${esc(mIndex[id].name)}</button>`).join('')}</div>`;}
function qCard(q,mode,len){const matched=completed.has(q.id);const correct=screen.solved||matched;let wrong=screen.wrong;return `<div class="question"><div class="question-tools"><span class="unit-pill">REVIEW QUESTION · ${screen.idx+1} / ${len}</span><span class="small muted">${correct?'✓ mastered':'Answer to continue'}</span></div><h3>${esc(q.stem)}</h3><div class="answers">${q.options.map((o,i)=>`<button class="answer ${correct&&i===q.answer?'right':wrong===i?'wrong':''}" data-action="answer" data-n="${i}" ${correct?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${correct?`<div class="feedback" role="status"><b>✓ Strong reasoning.</b> ${esc(q.why)}</div>`:wrong!==null?`<div class="feedback bad" role="status"><b>Try again.</b> ${esc(q.hint)}<br><small>Review each option; there are no penalties.</small></div>`:''}<div class="question-tools" style="margin-top:16px"><button class="hint" data-action="hint">${screen.hint?'Hide hint':'Show a hint'}</button><div>${navButton('q-next',screen.idx===len-1?'Finish this route':'Next question →',correct?'':'minor')}</div></div>${screen.hint?`<div class="note">${esc(q.hint)}</div>`:''}</div>`}
function archiveView(){return `${headline('HISTORICAL IMAGE LIBRARY','The visual archive','Real historic artworks, verified maps and photographs. Labels distinguish period sources, later depictions and modern memorials. Images are loaded from Wikimedia Commons, so an internet connection is needed to display them.')}<div class="grid two">${archive.map(a=>`<article class="card">${cardImage(a)}<div class="card-inner"><div class="eyebrow">${esc(a.type)} · ${esc(a.date)}</div><h3>${esc(a.title)}</h3><p>${esc(a.note)}</p><p class="small muted">${esc(a.credit)}</p><a target="_blank" rel="noopener noreferrer" href="${esc(a.page)}">See original image and license ↗</a></div></article>`).join('')}</div><div class="note">Historical source question: who made this image, when, why, for whom, and what can it not reliably tell us?</div>`;}
function worldMap(){const places=[['Europe','Europe & Atlantic',26,28,'exploration',['cortes','portugal','voc']],['Americas','Spanish Americas',20,57,'labor',['moctezuma','popay','tupac']],['Africa','West & Central Africa',48,54,'africa',['afonso','nzinga','maroon']],['West Asia','Ottoman & Safavid Worlds',56,32,'ottoman',['suleyman','ismail','abbas']],['South Asia','Mughal India',67,55,'mughal',['babur','akbar','aurangzeb']],['Russia','Russia',57,17,'russia',['ivan','peter']],['China','Ming & Qing China',77,35,'ming',['hongwu','zheng','kangxi']],['Japan','Tokugawa Japan',85,45,'tokugawa',['ieyasu']],['Spice Islands','Spice Islands',82,67,'maritime',['voc','merchant']]];let selected=places.find(x=>x[0]===screen.mapPin)||places[0],m=mIndex[selected[4]];return `${headline('GEOGRAPHY & GLOBAL TRADE','Explore the connected map','Select a region to discover linked people and curriculum challenges. The clickable map is a schematic navigation aid, not an accurate depiction of historic borders.')}<div class="map-grid"><div class="schematic" aria-label="Schematic world regions, not to scale"><svg viewBox="0 0 1000 540" preserveAspectRatio="none" aria-hidden="true"><g fill="#b7ae8070" stroke="#d5c69888" stroke-width="2"><path d="M55 94L165 63 215 100 258 152 223 205 270 258 235 285 179 261 151 207 94 192 60 150Z"/><path d="M220 274L289 273 322 347 289 410 252 488 218 455 202 387 185 316Z"/><path d="M431 137L505 102 573 128 594 175 563 238 550 325 504 377 460 350 429 290 398 223Z"/><path d="M549 98L648 75 727 106 806 95 912 156 926 215 852 249 788 207 736 240 700 312 666 300 617 248 562 230Z"/><path d="M769 329L815 326 845 358 848 397 803 401 778 375Z"/><path d="M882 412L941 418 975 453 952 491 896 487 857 449Z"/></g><g fill="#dfcfab70" font-size="22" font-family="Georgia,serif"><text x="80" y="130">AMERICAS</text><text x="420" y="240">AFRICA</text><text x="690" y="175">ASIA</text><text x="540" y="76">EUROPE</text></g><g stroke="#e6c37a99" stroke-width="2.7" fill="none" stroke-dasharray="10 10"><path d="M270 155Q370 170 440 220"/><path d="M440 220Q560 420 665 260"/><path d="M665 260Q755 170 850 200"/><path d="M265 155Q275 300 245 330"/></g></svg>${places.map((p,i)=>`<button class="map-pin ${screen.mapPin===p[0]?'active':''}" data-action="map-select" data-id="${esc(p[0])}" style="left:${p[2]}%;top:${p[3]}%" aria-label="Open ${esc(p[1])}">${i+1}</button><span class="pin-label" style="left:${p[2]}%;top:calc(${p[3]}% + 18px)">${esc(p[0])}</span>`).join('')}</div><aside class="map-details"><div class="eyebrow">SELECTED REGION</div><h3>${esc(selected[1])}</h3><p>${esc(m.description)}</p>${navButton('module','Review: '+m.name,'small',m.id)}<div class="rule"></div><div class="eyebrow">PEOPLE TO FOLLOW</div><div style="display:grid;gap:7px;margin-top:12px">${selected[5].map(id=>navButton('person',cIndex[id].name,'minor small',id)).join('')}</div></aside></div><div class="section"><div class="split equal"><div class="panel"><div class="eyebrow">REAL HISTORICAL MAP</div><h3>A cartographer’s world</h3><p>The adjacent schematic is built for clicking. Here is an actual historical atlas image, which students can compare against present-day geography.</p>${navButton('archive','Study the archival world map','secondary')}</div>${imgCard(aIndex.world)}</div></div><section class="section"><div class="eyebrow">MAP-BASED REASONING</div><h2>Which routes linked these societies?</h2><p class="muted">Trace commercial connections: Portuguese routes around Africa to India, Atlantic slave-trading circuits, Spanish silver across the Pacific, and older Indian Ocean networks.</p>${navButton('module','Try the Global Connections deck','', 'global')}</section>`;}
function coverageView(){return `${headline('TEACHER & STUDENT CHECKLIST','Complete pre-comp coverage','All listed Unit 1–3 strands have dedicated questions and associated perspective routes. This screen is the reliable route through every topic.')}<div class="grid three">${[1,2,3].map(u=>`<div class="panel"><div class="eyebrow">UNIT ${u}</div><h3>${u===1?'Age of Exploration':u===2?'Cross-Cultural Interactions':'Land-Based Empires'}</h3><ul class="cov">${modules.filter(m=>m.unit===u).map(m=>`<li><b>${esc(m.name)}</b><br><span class="small muted">${m.questions.filter(q=>completed.has(q.id)).length}/${m.questions.length} checks</span><br><button class="btn minor small" data-action="module" data-id="${m.id}">Practice →</button></li>`).join('')}</ul></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h3>Historical thinking skills also assessed</h3><p>Chronology · Mapping and spatial relationships · Comparison · Causes and effects · Change and continuity · Primary/secondary source analysis · Argument from historical evidence</p>${navButton('module','Try cross-unit synthesis','', 'global')}</div><details><summary>Data & progress settings</summary><p>Progress is kept in this browser only, using localStorage where available. It is not collected by the site, transferred to Schoology, or graded. Clearing browser data may erase progress.</p><button class="btn minor small" data-action="reset">Reset all practice progress</button></details>`;}
function interactionView(){return `${headline('HANDS-ON TASKS','Thinking like a historian','Short ungraded investigations supplement the 97 comprehension checks.')}<div class="grid"><div class="card"><div class="card-inner"><div class="eyebrow">SORTING CHALLENGE</div><h3>Empire or trading company?</h3><p>Classify political and commercial structures.</p>${navButton('activity','Start sorting','small','sort')}</div></div><div class="card"><div class="card-inner"><div class="eyebrow">CHRONOLOGY</div><h3>Arrange the centuries</h3><p>Place major cross-unit events in order.</p>${navButton('activity','Start timeline','small','timeline')}</div></div><div class="card"><div class="card-inner"><div class="eyebrow">SOURCE ANALYSIS</div><h3>Interpret evidence</h3><p>Explore an image and its limits.</p>${navButton('activity','Study a source','small','source')}</div></div></div>`;}
const sortItems=[['Cartaz','Trade regulation'],['VOC','Chartered company'],['Devshirme','State recruitment'],['Canton System','Trade regulation'],['Millet framework','Religious administration'],['Mansabdari','State recruitment'],['Joint-stock shares','Chartered company']];
const timelineEvents=[['Hongwu establishes Ming rule',1368],['Zheng He begins voyages',1405],['Portuguese reach India around Africa',1498],['Battle of Chaldiran',1514],['VOC established',1602],['Pueblo Revolt',1680],['Túpac Amaru II rebellion',1780]];
function activityView(){let id=screen.id;if(id==='sort'){let cats=['Trade regulation','Chartered company','State recruitment','Religious administration'];let submitted=Object.keys(screen.classify).length===sortItems.length;return `${headline('INTERACTIVE INVESTIGATION','Sort the institutions','For each term, choose the kind of institution or policy it represents.')}${sortItems.map(([term,right],i)=>`<div class="panel" style="margin-bottom:10px"><b>${esc(term)}</b><div class="filters" style="margin-bottom:0">${cats.map(cat=>`<button class="btn small ${screen.classify[i]===cat?'':'minor'}" data-action="sort-choice" data-i="${i}" data-id="${esc(cat)}">${esc(cat)}</button>`).join('')}</div>${submitted?`<div class="small" style="color:${screen.classify[i]===right?'#b6efc7':'#ffc3aa'}">${screen.classify[i]===right?'✓ Accurate':`Review: ${esc(right)}`}</div>`:''}</div>`).join('')}<div class="note">${Object.keys(screen.classify).length}/${sortItems.length} classified. ${submitted?'Compare each category with the feedback above.':'Finish each row to reveal feedback.'}</div>${navButton('activities','← All investigations','secondary')}</div>`}if(id==='timeline'){let chosen=screen.sequence,all=chosen.length===timelineEvents.length;let accuracy=all&&chosen.every((id,i)=>id===i);return `${headline('INTERACTIVE INVESTIGATION','Build a connected timeline','Select events in chronological order, earliest first. The last event is deliberately outside 1450–1750.')}<div class="panel"><div class="eyebrow">YOUR SEQUENCE · ${chosen.length}/${timelineEvents.length}</div><div class="timeline" style="margin:13px 0">${chosen.map((j,i)=>`<div class="item done">${i+1}. ${esc(timelineEvents[j][0])} · ${timelineEvents[j][1]}</div>`).join('')||'<div class="muted">No events selected yet.</div>'}</div><div class="rule"></div><div class="task-grid">${timelineEvents.map(([term,yr],i)=>`<button data-action="timeline-choice" data-n="${i}" ${chosen.includes(i)?'disabled':''}>${esc(term)}</button>`).join('')}</div><div class="actions"><button class="btn minor" data-action="timeline-reset">Reset order</button>${navButton('activities','All investigations','secondary')}</div>${all?`<div class="feedback ${accuracy?'':'bad'}">${accuracy?'✓ Chronology correct!':'Not quite. Reset and reconstruct the order, using the events’ dates.'}</div>`:''}</div>`}let a=aIndex.nzinga;return `${headline('EVIDENCE LAB','What can an image prove?','Look carefully at the medium, date, and source. A later picture of an earlier event is not an eyewitness photograph.')}<div class="split equal">${imgCard(a)}<div class="panel"><div class="eyebrow">SOURCE QUESTION</div><h3>Which claim can we safely support?</h3>${['This 1830s image gives Nzinga’s exact physical appearance in 1622.','The image shows how nineteenth-century artists later represented Nzinga.','The artist personally witnessed her negotiations.'].map((x,i)=>`<button class="choice" data-action="source-answer" data-n="${i}">${esc(x)}</button>`).join('')}${screen.sourceFocus?`<div class="feedback ${screen.sourceFocus===2?'':'bad'}">${screen.sourceFocus===2?'✓ Exactly. Its date reveals later memory and representation, not eyewitness observation.':'Consider when the work was produced. It cannot be a contemporary likeness of seventeenth-century events.'}</div>`:''}</div></div>`}
function render(){const view=screen.view,main=byId('app');let h='';if(view==='home')h=home();else if(view==='people')h=peopleView();else if(view==='person')h=personJourney(cIndex[screen.id]);else if(view==='mission')h=renderMission(cIndex[screen.id]);else if(view==='modules')h=moduleCards();else if(view==='module')h=moduleView(mIndex[screen.id]);else if(view==='archive')h=archiveView();else if(view==='map')h=worldMap();else if(view==='coverage')h=coverageView();else if(view==='activities')h=interactionView();else if(view==='activity')h=activityView();else h=home();main.innerHTML=h+ (view==='home'?`<section class="section"><div class="rule"></div>${navButton('activities','Try interactive mini-investigations','minor')}</section>`:'');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===view));}
function afterAnswer(n){const q=screen.view==='mission'?missionQs(cIndex[screen.id])[screen.idx]:mIndex[screen.id].questions[screen.idx];if(n===q.answer){completed.add(q.id);screen.solved=true;screen.wrong=null;save();}else{screen.wrong=n;screen.hint=true;}render();}
function qNext(){if(screen.view==='mission'){const p=cIndex[screen.id],qs=missionQs(p);if(!(screen.solved||completed.has(qs[screen.idx].id)))return;if(screen.idx===qs.length-1){peopleDone.add(p.id);connectionDone.add(p.bridge);save();screen.view='finished';byId('app').innerHTML=`<div class="crumb"><button data-action="people">← Character gallery</button></div><section class="panel" style="margin-top:30px;padding:42px"><div class="eyebrow">PERSPECTIVE COMPLETE</div><h2>You've connected ${esc(p.name)} to the wider world.</h2><p>All three comprehension checks are complete. Explore another historical perspective—or follow the cross-unit links to strengthen your understanding.</p><div class="note"><b>Connections uncovered:</b> ${esc(p.bridge)}</div><div class="actions">${p.modules.map(id=>navButton('module',mIndex[id].name,'secondary',id)).join('')}${navButton('people','Choose another person','')}</div></section>`;window.scrollTo(0,0);return;}}else{const m=mIndex[screen.id];if(!(screen.solved||completed.has(m.questions[screen.idx].id)))return;if(screen.idx===m.questions.length-1){setScreen('modules');return;}}screen.idx++;screen.solved=false;screen.wrong=null;screen.hint=false;render()}
document.addEventListener('click',event=>{let b=event.target.closest('[data-action]');if(!b)return;if(b.tagName==='A')event.preventDefault();let action=b.dataset.action,id=b.dataset.id,n=Number(b.dataset.n);if(['home','map','people','modules','archive','coverage','activities'].includes(action)){setScreen(action);return}if(action==='person'){setScreen('person',id);return}if(action==='module'){setScreen('module',id);return}if(action==='choose'){screen.chosen=n;render();return}if(action==='clear-choice'){screen.chosen=null;render();return}if(action==='start-mission'){startMission(cIndex[id]);return}if(action==='mission-index'||action==='deck-index'){screen.idx=n;screen.solved=false;screen.wrong=null;screen.hint=false;render();return}if(action==='answer'){afterAnswer(n);return}if(action==='hint'){screen.hint=!screen.hint;render();return}if(action==='q-next'){qNext();return}if(action==='map-select'){screen.mapPin=id;render();return}if(action==='activity'){setScreen('activity',id);return}if(action==='sort-choice'){screen.classify[b.dataset.i]=id;render();return}if(action==='timeline-choice'){if(!screen.sequence.includes(n))screen.sequence.push(n);render();return}if(action==='timeline-reset'){screen.sequence=[];render();return}if(action==='source-answer'){screen.sourceFocus=n+1;render();return}if(action==='reset'){if(confirm('Reset your saved practice progress on this browser?')){completed.clear();peopleDone.clear();connectionDone.clear();save();setScreen('coverage')}return}});
document.addEventListener('change',e=>{if(e.target.id==='unitFilter'){screen.unit=e.target.value;render()}if(e.target.id==='kindFilter'){screen.filter=e.target.value;render()}});
// Filter as user types, keep focus/caret stable
let filterTimer;document.addEventListener('input',e=>{if(e.target.id==='personSearch'){let value=e.target.value,pos=e.target.selectionStart;screen.search=value;render();let field=byId('personSearch');if(field){field.focus();field.setSelectionRange(pos,pos)}}});
render();
</script></body></html>
