tions":["Zheng He established permanent Chinese colonies, while Yongle abolished Confucian education.","Zheng He conquered European trading ports, while Yongle introduced the Single-Whip Reform.","Zheng He led diplomatic voyages, while Yongle sponsored a major encyclopedia project.","Zheng He established the Qing Dynasty, while Yongle expanded the imperial examination system.","Zheng He negotiated with the Manchus, while Yongle ended China's tributary relationships."],"answer":2,"why":"Correct response: Zheng He led diplomatic voyages, while Yongle sponsored a major encyclopedia project.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-122","stem":"How did the Ming Dynasty come to power?","options":["Hongwu led the Red Turban Rebellion against the Mongol-led Yuan Dynasty.","Yongle led the Red Turban Rebellion against the Mongol-led Yuan Dynasty.","Hongwu led a Confucian uprising against the ruling Manchu Qing Dynasty.","Zheng He organized a military rebellion against the Mongol-led Yuan Dynasty.","Yongle organized a peasant uprising against the ruling Manchu Qing Dynasty."],"answer":0,"why":"Correct response: Hongwu led the Red Turban Rebellion against the Mongol-led Yuan Dynasty.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ming"},{"id":"assess7-123","stem":"Why was the Battle of Sekigahara significant?","options":["It established Portuguese trading rights and expanded Jesuit influence throughout Japan.","It restored political authority to the emperor and ended the Japanese feudal system.","It secured Tokugawa Ieyasu's dominance and prepared the way for his shogunate.","It forced Tokugawa Ieyasu into exile and restored the authority of rival daimyo.","It ended Japanese isolationism and established diplomatic relations with European powers."],"answer":2,"why":"Correct response: It secured Tokugawa Ieyasu's dominance and prepared the way for his shogunate.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"tokugawa"},{"id":"assess7-124","stem":"Why did Tokugawa rulers increasingly restrict Christianity and European influence?","options":["They feared Christian converts and foreign missionaries could undermine political authority.","They feared Buddhist monasteries and Japanese merchants could undermine agricultural production.","They feared Shinto priests and regional daimyo could undermine European commercial influence.","They feared Confucian scholars and Chinese merchants could undermine imperial religious traditions.","They feared samurai warriors and rural peasants could undermine Portuguese colonial authority."],"answer":0,"why":"Correct response: They feared Christian converts and foreign missionaries could undermine political authority.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"tokugawa"},{"id":"assess7-125","stem":"How did Ivan III strengthen Russian independence?","options":["He defeated the Romanov dynasty and established direct control over the Russian nobility.","He conquered the Baltic coastline and established Russia's first permanent European capital.","He abolished Russian feudalism and transferred political authority to elected representatives.","He rejected Mongol overlordship and consolidated political authority around Moscow.","He ended the Russian Orthodox Church's influence and established a secular government."],"answer":3,"why":"Correct response: He rejected Mongol overlordship and consolidated political authority around Moscow.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-126","stem":"How did Peter the Great attempt to reduce the influence of traditional Russian nobles?","options":["He introduced the Table of Ranks to reward government service rather than ancestry alone.","He established the Romanov dynasty to replace hereditary positions held by powerful boyars.","He expanded the authority of boyars to encourage cooperation between regional governments.","He restored the Mongol tribute system to limit the political influence of Russian nobles.","He transferred administrative authority to the Orthodox Church to weaken hereditary privilege."],"answer":0,"why":"Correct response: He introduced the Table of Ranks to reward government service rather than ancestry alone.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-127","stem":"Why did Peter the Great establish St. Petersburg?","options":["To strengthen Russian control over the Mongol territories of Central Asia","To restore Moscow's religious authority over the Russian Orthodox Church","To establish a western-oriented capital with access to European trade","To protect Russia's southern borders from expanding Ottoman military forces","To establish an agricultural center independent of European commercial influence"],"answer":2,"why":"Correct response: To establish a western-oriented capital with access to European trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-128","stem":"How did the Canton System reflect Qing isolationism?","options":["It prohibited all foreign trade and restricted Chinese merchants from conducting commerce.","It concentrated Western maritime trade at Guangzhou under strict government regulations.","It required European merchants to adopt Confucian beliefs before entering Chinese territory.","It permitted unrestricted European commerce while limiting trade with neighboring Asian states.","It transferred authority over foreign commerce from imperial officials to European merchants."],"answer":1,"why":"Correct response: It concentrated Western maritime trade at Guangzhou under strict government regulations.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-129","stem":"Why did the kowtow become a source of tension between Qing officials and some European representatives?","options":["European representatives demanded exclusive control over the ceremonies performed at the imperial court.","Qing officials required foreign representatives to abandon their religions before receiving diplomatic recognition.","European representatives sought permission to replace traditional Chinese ceremonies with commercial agreements.","Qing officials expected ritual submission, while some Europeans rejected its implications for diplomatic equality.","European representatives demanded that Chinese officials perform identical ceremonies before visiting foreign monarchs."],"answer":3,"why":"Correct response: Qing officials expected ritual submission, while some Europeans rejected its implications for diplomatic equality.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-130","stem":"What was a major provision of the Treaty of Nanjing?","options":["China ceded Hong Kong to Britain and opened additional ports to British trade.","China ceded Guangzhou to Britain and prohibited foreign trade through Hong Kong.","China ceded Beijing to Britain and established British control over imperial taxation.","China ceded Taiwan to Britain and granted European merchants unrestricted inland access.","China ceded Shanghai to Britain and transferred authority over the imperial government."],"answer":0,"why":"Correct response: China ceded Hong Kong to Britain and opened additional ports to British trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"qing"},{"id":"assess7-131","stem":"How did Qing governing techniques compare with those of the Ming Dynasty?","options":["Both dynasties abolished Confucian administration, but the Qing restored Mongol military leadership.","Both dynasties relied on European advisers, but the Qing eliminated hereditary military institutions.","Both dynasties rejected imperial examinations, but the Qing established independent provincial governments.","Both dynasties decentralized political authority, but the Qing transferred power to regional merchants.","Both dynasties used Confucian bureaucracy, but the Qing also maintained distinct Manchu military institutions."],"answer":4,"why":"Correct response: Both dynasties used Confucian bureaucracy, but the Qing also maintained distinct Manchu military institutions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-132","stem":"What was the purpose of Akbar's Divine Faith (Din-i-Ilahi)?","options":["To establish a new branch of Sunni Islam that rejected Hindu religious traditions","To create a military alliance between Muslim rulers and Hindu religious communities","To restore traditional Hindu authority over the religious institutions of South Asia","To promote a spiritual philosophy incorporating ideas from several religious traditions","To establish a legal system combining Islamic law with traditional Hindu regulations"],"answer":3,"why":"Correct response: To promote a spiritual philosophy incorporating ideas from several religious traditions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-133","stem":"How did the Mansabdari and Zamindar systems support Mughal administration?","options":["Mansabdars supervised religious courts, while zamindars commanded the emperor's personal military guard.","Mansabdars regulated foreign commerce, while zamindars supervised the construction of imperial monuments.","Mansabdars controlled religious conversion, while zamindars organized provincial missionary activities.","Mansabdars governed independent kingdoms, while zamindars established hereditary military dynasties.","Mansabdars held ranked imperial positions, while zamindars helped collect agricultural revenue."],"answer":4,"why":"Correct response: Mansabdars held ranked imperial positions, while zamindars helped collect agricultural revenue.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"mughal"},{"id":"assess7-134","stem":"How did the religious policies of the Mughal, Ottoman, and Safavid empires differ?","options":["The Mughals enforced Shi'a Islam, the Ottomans promoted Hinduism, and the Safavids practiced Sunni Islam.","The Mughals rejected religious minorities, the Ottomans abolished Islamic law, and the Safavids promoted Hinduism.","The Mughals established Christianity, the Ottomans practiced Shi'a Islam, and the Safavids promoted Sunni Islam.","The Mughals prohibited Hindu worship, the Ottomans required Christian conversion, and the Safavids rejected Shi'a Islam.","The Mughals varied in toleration, the Ottomans used the millet system, and the Safavids promoted Shi'a Islam."],"answer":4,"why":"Correct response: The Mughals varied in toleration, the Ottomans used the millet system, and the Safavids promoted Shi'a Islam.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-135","stem":"What was the relationship between the Devshirme System and the Janissaries?","options":["Devshirme trained Muslim nobles, while Janissaries supervised provincial tax collection.","Devshirme recruited Christian boys, some of whom became elite Janissary soldiers.","Devshirme organized foreign merchants, while Janissaries regulated commercial trade routes.","Devshirme recruited tribal cavalry, while Janissaries governed independent religious communities.","Devshirme trained religious scholars, while Janissaries administered Islamic legal courts."],"answer":1,"why":"Correct response: Devshirme recruited Christian boys, some of whom became elite Janissary soldiers.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"ottoman"},{"id":"assess7-136","stem":"Which economic idea encouraged European nations to explore overseas in search of gold, silver, and new trade opportunities?","options":["Feudalism","Mercantilism","Socialism","Communism"],"answer":1,"why":"Correct response: Mercantilism.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-137","stem":"How did the Bubonic Plague contribute indirectly to European exploration?","options":["It increased Europe’s population and workforce.","It ended Europe’s interest in foreign trade.","It caused Europeans to abandon overseas travel.","It reduced the population and encouraged economic change and new opportunities."],"answer":3,"why":"Correct response: It reduced the population and encouraged economic change and new opportunities.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-138","stem":"Which technological development most directly helped European explorers travel farther across the oceans?","options":["Improved ships and navigation tools","The printing press","Gunpowder used in cannons","Mechanical clocks"],"answer":0,"why":"Correct response: Improved ships and navigation tools.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-139","stem":"Which statement best describes the Columbian Exchange?","options":["The exchange of plants, animals, people, and diseases across the Atlantic.","A trade agreement between European kings and African ruler","The movement of people only between European countries","A system used to collect taxes from American colonies"],"answer":0,"why":"Correct response: The exchange of plants, animals, people, and diseases across the Atlantic.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-140","stem":"What was one major consequence of the Columbian Exchange for Indigenous peoples in the Americas?","options":["Indigenous populations grew rapidly because of new European diseases.","European diseases caused widespread death among Indigenous populations.","Indigenous peoples gained immunity to all European diseases.","European diseases had little effect on Indigenous communities."],"answer":1,"why":"Correct response: European diseases caused widespread death among Indigenous populations.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-141","stem":"What was the Great Dying?","options":["The death of European sailors during ocean voyages","The decline of African populations caused by plantation farming","The large-scale population decline of Indigenous peoples in the Americas","The deaths caused by wars between European countries"],"answer":2,"why":"Correct response: The large-scale population decline of Indigenous peoples in the Americas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-142","stem":"Why did Europeans establish plantations in the Americas?","options":["To create small farms where families could grow food for themselves","To produce cash crops such as sugar and tobacco for profit and trade","To prevent Europeans from trading with other countries","To grow crops that were only used by Indigenous peoples"],"answer":1,"why":"Correct response: To produce cash crops such as sugar and tobacco for profit and trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-143","stem":"Which was a major consequence of the growth of cash-crop plantations in the Americas?","options":["Europeans stopped using forced labor.","Plantation owners produced fewer goods for trade.","It contributed to the expansion of the Atlantic slave trade.","Indigenous populations immediately recovered from disease."],"answer":2,"why":"Correct response: It contributed to the expansion of the Atlantic slave trade.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-144","stem":"What was the Triangular Trade?","options":["A trade network connecting Europe, Africa, and the Americas","A trade route connecting only European countries","A system for trading between China, India, and Japan","A trade agreement between Indigenous American societies"],"answer":0,"why":"Correct response: A trade network connecting Europe, Africa, and the Americas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"global"},{"id":"assess7-145","stem":"Which sequence best shows how European colonization affected the Americas?","options":["European arrival → Indigenous population growth → fewer plantations → decline in trade","European arrival → spread of diseases → Indigenous population decline → increased European control","European arrival → end of cash crops → decline of slavery → increased Indigenous population","European arrival → end of trade → abandonment of plantations → decline of European settlement"],"answer":1,"why":"Correct response: European arrival → spread of diseases → Indigenous population decline → increased European control.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-146","stem":"What was a major goal of Spanish conquistadors who explored the Americas?","options":["To establish democratic governments","To find wealth, claim land, spread Christianity, and gain power for Spain","To protect Indigenous empires from European influence","To establish peaceful trade agreements with every Indigenous society"],"answer":1,"why":"Correct response: To find wealth, claim land, spread Christianity, and gain power for Spain.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-147","stem":"Which statement best compares the goals of European explorers and conquistadors?","options":["Explorers focused only on spreading Christianity, while conquistadors focused only on trade.","Explorers and conquistadors had exactly the same goals and outcomes.","Explorers often searched for new trade routes and lands, while conquistadors sought wealth, territory, and power through conquest.","Explorers wanted to avoid contact with Indigenous peoples, while conquistadors wanted to live peacefully with them."],"answer":2,"why":"Correct response: Explorers often searched for new trade routes and lands, while conquistadors sought wealth, territory, and power through conquest.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"maritime"},{"id":"assess7-148","stem":"Which was a major outcome of European expeditions in the Americas?","options":["Europeans lost interest in overseas exploration.","Indigenous populations were largely unaffected by European arrival.","European nations stopped competing for land and resources.","Europeans gained land and resources as Indigenous societies faced conquest and disease."],"answer":3,"why":"Correct response: Europeans gained land and resources as Indigenous societies faced conquest and disease.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"exploration"},{"id":"assess7-149","stem":"What was one major consequence of the Atlantic Slave Trade?","options":["Millions of Africans were forcibly transported to the Americas, where many were forced to work on plantations.","European countries stopped using enslaved labor.","African societies became completely isolated from the rest of the world.","The population of the Americas increased only because of Indigenous population growth."],"answer":0,"why":"Correct response: Millions of Africans were forcibly transported to the Americas, where many were forced to work on plantations.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-150","stem":"How did the Atlantic Slave Trade contribute to the development of religions such as Santería and Vodou?","options":["Enslaved Africans abandoned all of their traditional beliefs and converted to indigenous religions.","European governments created these religions to control enslaved people through the fear of a deity.","African religious traditions blended with Christianity and other beliefs in the Americas.","These religions developed in Europe before the Atlantic Slave Trade began."],"answer":2,"why":"Correct response: African religious traditions blended with Christianity and other beliefs in the Americas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-151","stem":"Which statement best describes Santería?","options":["A syncretic developed in Haiti by combining African traditions with elements of Catholicism","A religion that developed in Japan through trade","A religion created by Spanish explorers before they reached the Americas","A syncretic religion that combines Yoruba traditions with elements of Catholicism."],"answer":3,"why":"Correct response: A syncretic religion that combines Yoruba traditions with elements of Catholicism.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-152","stem":"Which statement best describes Vodou?","options":["A religion that developed in Haiti and combines West African religious traditions with Christianity.","A religion that began in medieval Europe and spread to Africa.","A religion based entirely on Indigenous American traditions.","A syncretic religion that combines Yoruba traditions with elements of Catholicism."],"answer":0,"why":"Correct response: A religion that developed in Haiti and combines West African religious traditions with Christianity.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-153","stem":"Which statement about Rastafari is most accurate?","options":["It developed during the height of the Atlantic Slave Trade in the 1500s.","It developed in Jamaica in the 20th century and was influenced by African identity and Marcus Garvey's ideas.","It was created by Spanish conquistadors to convert Indigenous peoples during the 20th century","It developed in West Africa before Europeans arrived."],"answer":1,"why":"Correct response: It developed in Jamaica in the 20th century and was influenced by African identity and Marcus Garvey's ideas.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-154","stem":"Which statement best explains how the Atlantic Slave Trade influenced culture in the Americas?","options":["It eliminated African cultural traditions from the Americas.","It prevented new religious traditions from developing.","It caused European and African cultures to remain completely separate.","It contributed to new traditions blending African, European, and American influences."],"answer":3,"why":"Correct response: It contributed to new traditions blending African, European, and American influences.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-155","stem":"Which of the following best describes a cultural change that resulted from the Atlantic Slave Trade?","options":["African traditions were replaced by European traditions throughout the Americas.","European traditions remained separate from African traditions in the Americas.","African, European, and Indigenous traditions blended to create new cultural practices.","Indigenous traditions became the main influence on religious practices throughout the Americas."],"answer":2,"why":"Correct response: African, European, and Indigenous traditions blended to create new cultural practices.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-156","stem":"Which statement best explains the relationship between plantation agriculture and the Atlantic Slave Trade?","options":["Plantation owners needed large amounts of labor, increasing the demand for enslaved Africans.","Plantation owners relied mainly on European workers, reducing the demand for enslaved Africans.","Plantation agriculture required little labor, limiting the growth of the Atlantic Slave Trade.","Plantation owners depended mostly on Indigenous workers, reducing the need for African labor."],"answer":0,"why":"Correct response: Plantation owners needed large amounts of labor, increasing the demand for enslaved Africans.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-157","stem":"What was the Middle Passage, and what was one of its major consequences?","options":["A trade route between Europe and Asia that increased European access to luxury goods.","A forced journey across the Atlantic that caused widespread death and suffering among enslaved Africans.","A migration route from the Americas to Europe that increased European populations.","A trade route between Africa and Asia that allowed African merchants to expand their empires."],"answer":1,"why":"Correct response: A forced journey across the Atlantic that caused widespread death and suffering among enslaved Africans.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-158","stem":"Which statement best describes chattel slavery in the Americas?","options":["Enslaved workers were paid wages and could leave plantations after completing their contracts.","Enslaved workers were temporarily controlled but could eventually gain ownership of plantation land.","Enslaved people were treated as property and could be bought, sold, and passed down through families.","Enslaved workers were primarily hired for short periods when plantations needed additional labor."],"answer":2,"why":"Correct response: Enslaved people were treated as property and could be bought, sold, and passed down through families.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"labor"},{"id":"assess7-159","stem":"Which city became the political center of Russia under Ivan III and later served as the capital of the early Romanov dynasty?","options":["Kiev","Moscow","St. Petersburg","Novgorod"],"answer":1,"why":"Correct response: Moscow.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-160","stem":"Which Russian city was known as the “Window to the West”?","options":["Kiev","Moscow","Novgorod","St. Petersburg"],"answer":3,"why":"Correct response: St. Petersburg.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-161","stem":"Which Mongol khanate controlled much of the Russian territory before Ivan III established independence?","options":["Chagatai Khanate","Ilkhanate","Golden Horde","Yuan Dynasty"],"answer":2,"why":"Correct response: Golden Horde.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-162","stem":"Which change occurred in Russia under Ivan III?","options":["The oprichnina was established to weaken the boyars and strengthen the tsar’s authority.","The Romanov dynasty began ruling Russia, restoring stability after a period of political unrest.","Moscow emerged as the center of a unified Russian state that ended Mongol domination.","St. Petersburg was established as a new capital to strengthen Russia’s connections with Europe."],"answer":2,"why":"Correct response: Moscow emerged as the center of a unified Russian state that ended Mongol domination.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-163","stem":"How did Peter the Great change the relationship between the Russian Orthodox Church and the Russian government?","options":["He granted the Church greater independence from the Russian monarchy.","He placed the Church under greater control of the Russian government.","He required the Church to adopt the religious practices of Catholic Europe.","He removed the Church’s influence from Russian government and society."],"answer":1,"why":"Correct response: He placed the Church under greater control of the Russian government.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-164","stem":"How did Peter the Great’s reforms affect the Russian nobility (boyars)?","options":["He granted boyars greater independence in governing their hereditary lands.","He abolished the nobility and transferred their estates to Russian peasants.","He required nobles to serve the state through military or government positions.","He allowed boyars to elect government officials and limit the tsar’s authority."],"answer":2,"why":"Correct response: He required nobles to serve the state through military or government positions.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-165","stem":"Which statement best describes the condition of Russian serfs under Peter the Great?","options":["Serfs gained the right to leave their estates and seek paid employment in Russian cities.","Serfs were granted ownership of farmland in exchange for military service to the tsar.","Serfdom was gradually abolished as Russia adopted Western European social reforms.","Serfs remained tied to the land, while their labor and tax obligations increased."],"answer":3,"why":"Correct response: Serfs remained tied to the land, while their labor and tax obligations increased.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-166","stem":"What was the primary purpose of Peter the Great’s Table of Ranks?","options":["To organize Russian peasants into social classes based on land ownership.","To divide Russian territory into provinces governed by hereditary nobles.","To establish military ranks based primarily on noble birth and family status.","To determine advancement in government and military service based on rank and achievement."],"answer":3,"why":"Correct response: To determine advancement in government and military service based on rank and achievement.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-167","stem":"What was the primary purpose of the beard tax introduced in Russia?","options":["To increase government revenue by taxing wealthy merchants and landowners.","To encourage Russian men to adopt Western European customs and appearances.","To reduce the influence of the Russian Orthodox Church over religious practices.","To distinguish members of the Russian military from ordinary Russian citizens."],"answer":1,"why":"Correct response: To encourage Russian men to adopt Western European customs and appearances.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-168","stem":"Which statement best describes the impact of Peter the Great’s westernization policies on Russia?","options":["Russia abandoned its monarchy and adopted a representative government modeled after England.","Russia reduced its military strength and focused primarily on agricultural development.","Russia modernized its military and government while maintaining an absolute monarchy.","Russia granted greater political independence to nobles and reduced the tsar’s authority."],"answer":2,"why":"Correct response: Russia modernized its military and government while maintaining an absolute monarchy.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-169","stem":"What was the significance of the Romanov dynasty’s rise to power in 1613?","options":["It ended a period of political instability and helped restore stability in Russia.","It ended Mongol control and established Moscow as Russia’s political center.","It introduced Western European reforms and established a modern Russian navy.","It abolished serfdom and reduced the political influence of Russian nobles."],"answer":0,"why":"Correct response: It ended a period of political instability and helped restore stability in Russia.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-170","stem":"How did the Russian Empire’s geography influence Peter the Great’s efforts to expand trade with Europe?","options":["Russia’s extensive coastline along the Atlantic Ocean made European trade easily accessible.","Russia’s location along the Mediterranean Sea allowed direct access to European markets.","Russia’s southern borders provided unrestricted access to warm-water ports throughout the year.","Russia’s limited access to ice-free ports encouraged Peter to seek control of Baltic Sea territory."],"answer":3,"why":"Correct response: Russia’s limited access to ice-free ports encouraged Peter to seek control of Baltic Sea territory.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"},{"id":"assess7-171","stem":"Which statement best describes the role of feudalism in Russia from Ivan III through Peter the Great?","options":["Landholding nobles maintained authority over peasants, while the monarchy increasingly centralized political power.","Peasants gained ownership of farmland as nobles lost their traditional economic privileges.","Russian rulers replaced hereditary landownership with an elected system of provincial government.","The Russian Orthodox Church abolished noble landownership and redistributed estates to peasants."],"answer":0,"why":"Correct response: Landholding nobles maintained authority over peasants, while the monarchy increasingly centralized political power.","hint":"Check the key people, policies, and cause-and-effect relationships in this lesson.","deck":"russia"}]</script>
<script>
'use strict';
// Version 5.3 is a pinned original of this same GitHub Pages website.
// This loader merges teacher-supplied assessment questions into the current
// 13 content decks without altering the map, cards, certificates or activities.
(async function(){
 const note=document.getElementById('loader-note');
 const sources=["https://raw.githubusercontent.com/MRShodgepodge4048-cpu/history-7-connected-world/051ea01ab924616dfe8d21ffe5b2bbdc7a4e8805/index.html", "https://cdn.jsdelivr.net/gh/MRShodgepodge4048-cpu/history-7-connected-world@051ea01ab924616dfe8d21ffe5b2bbdc7a4e8805/index.html"];
 let original='',lastError='';
 for(const url of sources){
  try{
   const response=await fetch(url,{mode:'cors',cache:'force-cache'});
   if(!response.ok)throw Error('HTTP '+response.status);
   const txt=await response.text();
   if(!txt.includes('id="game-data"') || !txt.includes('const DATA='))throw Error('Website source not recognized');
   original=txt;break;
  }catch(error){lastError=String(error);}
 }
 if(!original){
  note.textContent='The original website could not load. Check your internet connection and try again.';
  const btn=document.createElement('button');btn.textContent='Try again';btn.onclick=()=>location.reload();
  note.appendChild(document.createElement('br'));note.appendChild(btn);
  console.error('History 7 source unavailable:',lastError);return;
 }
 try{
  const re=/(<script\s+id=["']game-data["'][^>]*>)([\s\S]*?)(<\/script>)/i;
  const match=original.match(re);if(!match)throw Error('Could not find question data');
  const data=JSON.parse(match[2]);
  const incoming=JSON.parse(document.getElementById('assessment-review-data').textContent);
  const existing=new Set(data.modules.flatMap(m=>m.questions.map(q=>q.stem.toLowerCase().replace(/[^a-z0-9]+/g,''))));
  let added=0;
  for(const record of incoming){
   const module=data.modules.find(m=>m.id===record.deck);
   if(!module)throw Error('Unknown review deck '+record.deck);
   const normalized=record.stem.toLowerCase().replace(/[^a-z0-9]+/g,'');
   if(existing.has(normalized))continue;
   existing.add(normalized);
   module.questions.push({id:record.id,stem:record.stem,options:record.options,answer:record.answer,why:record.why,hint:record.hint});
   added++;
  }
  if(added<100)throw Error('Question import unexpectedly small ('+added+')');
  const patched=original.replace(re,(_,a,b,c)=>a+JSON.stringify(data).replace(/</g,'\\u003c')+c);
  document.open();document.write(patched);document.close();
 }catch(error){
  note.textContent='We could not load the review decks. The original website has not been changed.';
  console.error('History 7 question import error:',error);
 }
})();
</script></body></html>
