rd."},{"id":"exploration-4","stem":"Which exchange followed sustained contact between Afro-Eurasia and the Americas after 1492?","options":["Only silver traveled west across the Atlantic","Plants, animals, pathogens and peoples moved between hemispheres","Europe stopped consuming American crops","American societies remained isolated from introduced diseases"],"answer":1,"why":"The Columbian Exchange involved crops, animals, diseases and human movement in both directions, with unequal effects.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"exploration-5","stem":"Why did epidemic diseases contribute to the Great Dying in the Americas?","options":["Indigenous peoples had no agriculture or settlements","Introduced pathogens spread among populations with little prior exposure","All European sailors arrived with the same disease","The exchange of potatoes directly caused mass mortality"],"answer":1,"why":"Introduced infections, together with warfare, exploitation and disruption, produced catastrophic demographic losses.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"exploration-6","stem":"What is a key distinction between a conquistador and a merchant captain?","options":["Conquistadors pursued conquest and political power; merchants primarily sought trade","Conquistadors never participated in expeditions","Merchant captains always ruled conquered territories","Both professions were legally identical"],"answer":0,"why":"Conquistadors were military conquerors, while commercial expeditions had different primary aims, though profit and violence could overlap.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"exploration-7","stem":"Which map route best represents Vasco da Gama’s voyages?","options":["Portugal around Africa’s Cape of Good Hope toward India","Spain westward directly across the Pacific to Japan","Russia across Siberia to Alaska in 1492","China ofits and financial risks.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-3","stem":"What was a galleon particularly associated with?","options":["Long-distance sailing, armed commerce and transoceanic transport","A mounted land army used by the Ottomans","The Ming imperial examination system","An African inland market without ships"],"answer":0,"why":"Galleons were oceangoing ships used by European powers for trade and, often, warfare.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-4","stem":"Why were the Spice Islands important in European commercial competition?","options":["They were prized sources of nutmeg and cloves","They supplied Europe’s only wheat fields","They were the seat of the Ottoman sultan","They prohibited every form of export"],"answer":0,"why":"Parts of the Moluccas were important sources of highly valued spices, driving commercial rivalry.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-5","stem":"How did the Dutch VOC differ from Spanish conquest in the Americas?","options":["The VOC emphasized company-run Asian commercial networks; Spain built large territorial colonies in the Americas","The VOC exclusively explored Antarctica; Spain exclusively traded in China","Neither claimed political power or used force","Spanish expansion depended mainly on VOC shareholders"],"answer":0,"why":"The VOC operated as a chartered commercial company with coercive powers, while Spanish American expansion established extensive colonial rule.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-6","stem":"Which statement correctly compares Portuguese, British and French activity in Asia?","options":["All followed exactly the same route and founded identical empires","Each participated in shifting commercial and imperial competition, with different territories and strategies","Only the Portuguese established coastal trading posts","None ever traded with Indian merchants"],"answer":1,"why":"These maritime powers competed in trade and empire-building but developed different geographic footholds and institutions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-7","stem":"What changed when Europeans entered the Indian Ocean trade network?","options":["They joined and contested an older network, at times imposing armed controls","Trade between India and East Africa began for the first time","Arab, Indian and Southeast Asian merchants all vanished","Merchants stopped using monsoon winds"],"answer":0,"why":"Existing trade networks persisted while Portuguese and later European entrants sometimes imposed violence, monopolies and fortifications.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"maritime-8","stem":"Which place is most directly connected with Portuguese voyages around Africa into Asian trade?","options":["The Cape of Good Hope","The Andes Mountains","Kyoto","St. Petersburg"],"answer":0,"why":"Rounding the Cape of Good Hope linked Atlantic routes to Indian Ocean voyages.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"labor","unit":1,"name":"Colonial Labor & Society","region":"Americas","tag":"Systems","description":"Plantations, coercion, caste hierarchies, migration and cultural survival.","connections":["africa","resistance","mughal"],"questions":[{"id":"labor-1","stem":"Why did European plantations in the Americas demand large labor forces?","options":["Cash crops such as sugar required substantial work for production and processing","The Americas had no inhabitants before conquest","Plantations produced only enough food for one household","Mercantilism outlawed export agriculture"],"answer":0,"why":"Plantation commodities required demanding labor, and colonial powers created coercive labor systems to supply it.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-2","stem":"What was the Middle Passage?","options":["The forced Atlantic voyage transporting enslaved Africans to the Americas","The voyage from China to Japan under tribute diplomacy","A route from Russia to the Baltic Sea","The overland march of Janissaries to Anatolia"],"answer":0,"why":"The Middle Passage was the deadly ocean crossing endured by enslaved Africans in the transatlantic trafficking system.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-3","stem":"What does chattel slavery mean in Atlantic colonial systems?","options":["A system treating enslaved people as legally owned property, often inherited by descent","A temporary maritime employment contract","A tax imposed only on landowners","A guild arrangement for skilled artisans"],"answer":0,"why":"Chattel slavery reduced human beings to legally transferable property and was often hereditary.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-4","stem":"How did the colonial casta system operate in Spanish America?","options":["It ranked people by perceived ancestry and social categories","It ended distinctions connected to descent","It elected rulers through a single equal-vote parliament","It assigned officers to the Qing Banner armies"],"answer":0,"why":"Casta classifications associated ancestry with social position, law and perceived status in Spanish colonial society.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-5","stem":"What is a defensible comparison of Inca mit’a and Spanish encomienda?","options":["Both extracted Indigenous labor or tribute, but under different authorities and arrangements","Both guaranteed wage equality for Indigenous workers","Encomienda began as an Inca religious festival","Mit’a was created by Dutch shareholders in Asia"],"answer":0,"why":"The Inca mit’a was a labor obligation under the Inca state; Spanish encomienda assigned colonists rights to Indigenous tribute and labor obligations, involving different institutions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-6","stem":"How does syncretism help explain religions such as Santería and Vodou?","options":["Traditions were blended, including African religious practices with elements of Christianity","African cultural practices disappeared everywhere","All religions in the Americas became identical","Only European people practiced religious mixing"],"answer":0,"why":"Santería and Haitian Vodou demonstrate cultural survival and transformation through the blending of religious traditions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-7","stem":"Which statement about Rastafari is historically precise?","options":["Rastafari emerged in twentieth-century Jamaica and is a later legacy, not a seventeenth-century religion","Rastafari was the official religion of Kongo in 1500","Rastafari began when the VOC was chartered in 1602","Rastafari was the legal basis of Spanish encomienda"],"answer":0,"why":"Rastafari arose in twentieth-century Jamaica; the curriculum includes it among later cultural legacies, so the timeline must remain clear.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"labor-8","stem":"Which statement best describes triangular Atlantic trade?","options":["A network linking European, African and American economies through unequal commodity and human flows","A mandatory route that every ship traveled in a perfect triangle","A Ming map of Chinese internal trade","A treaty dividing Japan into three ports"],"answer":0,"why":"Triangular trade describes linked Atlantic exchanges; actual voyages and commercial routes varied rather than following one identical triangle.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"africa","unit":2,"name":"African States & Atlantic World","region":"Africa","tag":"Change","description":"Ashanti, Oyo, Benin, Kongo, King Afonso, diplomacy and the trade in enslaved people.","connections":["labor","resistance","maritime"],"questions":[{"id":"africa-1","stem":"Where was the Kingdom of Kongo located?","options":["West-central Africa, around the lower Congo River","East Asia near Beijing","Central Mexico","Western Europe along the Rhine"],"answer":0,"why":"Kongo occupied part of west-central Africa, including areas of modern Angola and the Democratic Republic of the Congo.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-2","stem":"How did King Afonso I respond to Portuguese involvement in Kongo?","options":["He engaged diplomatically and criticized unlawful enslavement and trafficking","He personally established the Dutch VOC","He conquered the Spanish empire in Peru","He abolished Christianity in the kingdom"],"answer":0,"why":"Afonso adopted Christianity and maintained Portuguese relations but expressed serious concern about the trafficking of people and abuses.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-3","stem":"Which set correctly names African states studied in Unit 2?","options":["Ashanti, Oyo, Benin and Kongo","Aztec, Inca, Maya and Olmec","Ming, Qing, Tokugawa and Mughal","Ottoman, Safavid, Romanov and Habsburg"],"answer":0,"why":"The African states strand specifically names Ashanti, Oyo, Benin and Kongo.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-4","stem":"How could Atlantic slave trading affect the societies involved in Africa?","options":["It could reshape political competition, social structures and gender balances","It had no impact beyond the ships themselves","It ended all conflict among African states","It prevented African leaders from negotiating with Europeans"],"answer":0,"why":"Demand and violence around the Atlantic slave trade influenced warfare, governance, class relations and demographics, with variation by society.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-5","stem":"What caution is important when comparing Ashanti, Oyo, Benin and Kongo?","options":["They had distinct institutions and histories rather than one identical response","They were all Dutch plantations","They all shared a single king and capital","Each was established by the Ming emperor"],"answer":0,"why":"These were separate African political societies with varied histories and relationships to commerce and European expansion.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-6","stem":"Which statement best identifies the link between Unit 1 and King Afonso’s challenges?","options":["European Atlantic trade and rising demand for enslaved labor affected Kongo’s politics","The fall of the Ming created the Kongo kingdom","The Tokugawa Closed Country Policy governed Portuguese ships in Angola","Russian Westernization eliminated slavery in Kongo"],"answer":0,"why":"Commercial exchange, including trafficking, connected maritime expansion to African state politics and diplomacy.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"africa-7","stem":"What is an appropriate source-analysis question about a letter from Afonso I?","options":["What concerns does the king express, and to whom is he writing?","How many voyages did the VOC make in the eighteenth century?","Which Inca ruler wrote this letter?","Can the letter prove that every Kongo resident agreed?"],"answer":0,"why":"Examining author, audience and purpose helps interpret Afonso’s letters as evidence without overgeneralizing.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"resistance","unit":2,"name":"Resistance & Rebellion","region":"Atlantic","tag":"Agency","description":"African and Indigenous responses, Queen Nzinga, Po’pay, Maroons and Túpac Amaru II.","connections":["labor","africa","ottoman"],"questions":[{"id":"resistance-1","stem":"What was a key achievement of the Pueblo Revolt of 1680?","options":["Pueblo communities drove Spanish colonists from New Mexico for a period","It founded the Safavid dynasty","It abolished the VOC’s charter","It placed New Mexico under Ming rule"],"answer":0,"why":"The Pueblo Revolt forced Spanish settlers out of New Mexico for about twelve years.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-2","stem":"Who was Po’pay?","options":["A Tewa leader associated with organizing the Pueblo Revolt of 1680","An Ottoman grand vizier under Suleyman","A Portuguese cartographer of the Spice Islands","A Dutch investor in the VOC"],"answer":0,"why":"Po’pay played a central role in coordinating the 1680 uprising against Spanish colonial authority.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-3","stem":"What was a central goal of Queen Nzinga’s diplomacy and resistance?","options":["Protect the sovereignty and security of Ndongo and Matamba amid Portuguese expansion","Obtain the throne of the Ming Dynasty","Create Russian beard-tax reforms","Restore the Aztec capital after 1700"],"answer":0,"why":"Nzinga navigated diplomacy, conflict and alliances to defend political interests in central Africa.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-4","stem":"What were Maroon societies?","options":["Communities founded by people who escaped enslavement, often defending autonomy","Official Spanish councils in Madrid","Units of the Janissary corps","The hereditary classes of Qing China"],"answer":0,"why":"Maroon communities developed varied forms of independent life and resistance in the Americas.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-5","stem":"How did the Túpac Amaru II rebellion connect to earlier Spanish colonial labor systems?","options":["It challenged colonial abuses in Peru, including exploitative institutions and tribute obligations","It was led by the same person who built Machu Picchu","It established encomienda across Europe in 1492","It occurred before Spanish arrival in the Andes"],"answer":0,"why":"Túpac Amaru II’s uprising began in 1780, later than the game’s central period, and challenged Spanish colonial power and abuses.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-6","stem":"Which comparison of Po’pay and Queen Nzinga is strongest?","options":["Both resisted forms of European expansion, but in different regions and situations","Both were rulers of the same kingdom","Both led identical revolts in 1680","Both founded Dutch trading companies"],"answer":0,"why":"Their circumstances differed, but both illuminate Indigenous and African agency in response to imperial pressures.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"resistance-7","stem":"What is the distinction between a revolt and the broader idea of resistance?","options":["A revolt is one form of resistance; resistance can include diplomacy, escape and cultural persistence","Resistance always means a naval battle","A revolt is never organized by local communities","Resistance only occurred in Europe"],"answer":0,"why":"Resistance takes many forms; armed revolt is one among several strategies for opposing domination.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"ming","unit":2,"name":"Ming China & Silver","region":"East Asia","tag":"Exchange","description":"The rise of Ming, taxes, tributary diplomacy, Zheng He and global silver.","connections":["maritime","qing","tokugawa"],"questions":[{"id":"ming-1","stem":"Which leader founded the Ming Dynasty after the collapse of Yuan rule?","options":["Hongwu Emperor","Qianlong Emperor","Tokugawa Ieyasu","Aurangzeb"],"answer":0,"why":"Zhu Yuanzhang became the Hongwu Emperor and established the Ming Dynasty in 1368.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-2","stem":"How was the Red Turban movement connected to Ming origins?","options":["It was part of rebellions against Yuan rule that preceded Ming establishment","It was a revolt against the Spanish encomienda","It was the army that built the Taj Mahal","It ended the VOC in 1700"],"answer":0,"why":"The Red Turban rebellions destabilized the Yuan and were part of the upheavals from which Ming leadership emerged.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-3","stem":"What was the Ming tributary system intended to do?","options":["Structure diplomatic relationships through ritual hierarchy and exchanges","Require all foreigners to become Janissaries","Replace Chinese farming with Atlantic plantations","Ban all maritime contact in every reign"],"answer":0,"why":"Tributary relationships organized diplomatic recognition and exchanges through Ming-centered ceremonial expectations.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-4","stem":"Why was the Single-Whip reform important to global trade?","options":["It consolidated fiscal obligations and increased the importance of silver payments","It replaced silver with salt as China’s only money","It created the Spanish galleon fleet","It abolished the need for taxes"],"answer":0,"why":"The Single-Whip reform helped standardize fiscal obligations in silver, linking domestic taxation to silver circulation.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-5","stem":"What was Zheng He best known for?","options":["Commanding large Ming maritime expeditions across the Indian Ocean","Founding the Dutch VOC","Leading the Pueblo Revolt","Establishing the Tokugawa shogunate"],"answer":0,"why":"Zheng He led state-sponsored voyages demonstrating Ming maritime reach and diplomacy in the early fifteenth century.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-6","stem":"Which achievement is associated with the Yongle Emperor?","options":["Sponsoring a vast encyclopedia project","Building the Taj Mahal","Creating the Russian beard tax","Signing the Treaty of Nanjing"],"answer":0,"why":"The Yongle Emperor sponsored the enormous Yongle Encyclopedia project.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ming-7","stem":"What helped create opportunity for Manchu conquest of Ming China?","options":["Internal instability and military pressures weakened the Ming","Portugal conquered Beijing in 1510","The VOC selected a Chinese emperor","Japan annexed all of China after Sekigahara"],"answer":0,"why":"Fiscal stress, rebellion and military conflict helped weaken Ming rule before Manchu-led Qing consolidation.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"tokugawa","unit":2,"name":"Tokugawa Japan","region":"East Asia","tag":"Policy","description":"Sekigahara, unification, the shogunate, Jesuits and regulation of overseas contacts.","connections":["maritime","qing","ming"],"questions":[{"id":"tokugawa-1","stem":"Why was the Battle of Sekigahara (1600) important?","options":["It secured Tokugawa Ieyasu’s dominance before he became shogun","It founded the Ming Dynasty","It ended the Atlantic slave trade","It forced Akbar to leave India"],"answer":0,"why":"Ieyasu’s victory established the power that underpinned the Tokugawa shogunate founded in 1603.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-2","stem":"Which set accurately describes Japan’s military and political hierarchy?","options":["Emperor, shogun, daimyo and samurai had distinct roles","Galleon, VOC, cartaz and encomienda were social ranks","Shah, boyar, pharaoh and mandarin were Tokugawa officials","All power belonged equally to village councils"],"answer":0,"why":"The emperor retained symbolic authority while shoguns, daimyo and samurai occupied particular political and military roles.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-3","stem":"What does the Sengoku period refer to?","options":["An era of extensive warfare among competing Japanese powers","The Ming maritime voyages of Zheng He","Spanish conquest of the Andes","The Qing Opium Wars"],"answer":0,"why":"Sengoku means the Warring States period, preceding Tokugawa unification.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-4","stem":"Why did Tokugawa authorities restrict some overseas contacts?","options":["To manage political security, foreign religious influence and international trade","Because Japan lacked any ports or coastline","Because the emperor abolished all commerce","To join the Spanish empire permanently"],"answer":0,"why":"The shogunate regulated foreign trade and missionary activity; restrictions did not mean Japan had zero external contact.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-5","stem":"What is a historically accurate description of the Closed Country Policy?","options":["Restrictions channeled foreign contact through limited, controlled relationships","All foreign people and goods were permanently absent","Every Japanese port operated as a free European colony","The policy began in the thirteenth century"],"answer":0,"why":"Tokugawa overseas restrictions narrowed and regulated contacts, including permitted Dutch and Chinese trade at Nagasaki.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-6","stem":"How did Portuguese Jesuit activity affect Tokugawa policy?","options":["Christian missions and ties to European traders contributed to political concerns","It gave the Portuguese immediate control of Kyoto","It convinced all daimyo to abandon Buddhism","It introduced the Single-Whip reform"],"answer":0,"why":"Christianity’s spread and political worries surrounding missionaries influenced Tokugawa regulation and persecution.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"tokugawa-7","stem":"What was Edo during Tokugawa rule?","options":["The shogunate’s governing center, later called Tokyo","The Safavid capital in Persia","A Portuguese naval pass","The Mughal court’s main religion"],"answer":0,"why":"Edo became the Tokugawa political center, while Kyoto remained the imperial capital.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"russia","unit":3,"name":"Russia & Westernization","region":"Eurasia","tag":"Reform","description":"Ivan III, Peter I, serfs, boyars, religious continuity and Westernization.","connections":["qing","ottoman","maritime"],"questions":[{"id":"russia-1","stem":"Which change is most closely associated with Ivan III?","options":["Consolidating Muscovite power and ending Golden Horde domination","Creating the Canton System","Conquering the Spice Islands for the VOC","Constructing the Taj Mahal"],"answer":0,"why":"Ivan III enlarged Muscovite authority and rejected tribute obligations to the Golden Horde.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-2","stem":"Why did Peter the Great build St. Petersburg?","options":["To establish a western-facing capital and access to Baltic trade","To move the Ottoman capital to Russia","To restore the Ming tribute system","To create a sugar plantation in the Caribbean"],"answer":0,"why":"St. Petersburg symbolized Peter’s western-oriented reforms and Russia’s connection to the Baltic.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-3","stem":"What was Peter’s beard tax intended to influence?","options":["Elite appearance and adoption of certain Western European customs","Prices of spices on Dutch ships","The religious rank of Janissaries","The succession of Ming emperors"],"answer":0,"why":"The beard tax targeted visible customary practices as part of Peter’s broader Westernizing agenda.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-4","stem":"How did serfdom contribute to Russian social hierarchy?","options":["Many peasants were legally bound to estates and subject to landlord authority","Serfs automatically became elected senators","Serfs were members of the VOC","Serfdom ended all status differences"],"answer":0,"why":"Russian serfdom constrained peasant mobility and tied labor obligations to landholding elites.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-5","stem":"Who were boyars?","options":["Members of the Russian high aristocracy","Ming maritime officials","Spanish plantation owners in Peru","Ottoman Janissary recruits"],"answer":0,"why":"Boyars were a prominent noble elite in Muscovite and early imperial Russia.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-6","stem":"Which institution remained central to Russian identity across changing rulers?","options":["Russian Orthodox Church","Dutch East India Company","Japanese Jesuit mission","Portuguese cartaz office"],"answer":0,"why":"The Russian Orthodox Church remained influential even as rulers altered political and social structures.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"russia-7","stem":"What describes a continuity and a change from Ivan III to Peter I?","options":["Centralized royal power continued; Peter pursued more explicit Westernizing reforms","Russia remained only a Golden Horde province","All nobles became peasants under Peter","Russia abandoned Christianity entirely"],"answer":0,"why":"Consolidated autocratic monarchy remained important, while Peter changed military, administrative and cultural institutions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"qing","unit":3,"name":"Manchu/Qing Rule & Trade","region":"East Asia","tag":"Empire","description":"Banner armies, Nerchinsk, Canton, kowtow and later imperial conflict.","connections":["ming","maritime","tokugawa"],"questions":[{"id":"qing-1","stem":"What made the Qing Banner System significant?","options":["It organized Manchu-led military and social structures supporting conquest and governance","It licensed Portuguese ships in the Indian Ocean","It distributed Spanish encomiendas","It printed the Yongle Encyclopedia"],"answer":0,"why":"The Eight Banners combined military, administrative and social functions crucial to Manchu Qing power.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-2","stem":"What did the Treaty of Nerchinsk (1689) address?","options":["Border and diplomatic relations between Qing China and Russia","Spain’s control of Peru","A peace settlement at Sekigahara","The Dutch monopoly on nutmeg"],"answer":0,"why":"Nerchinsk was an early treaty governing Qing-Russian border questions and diplomacy.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-3","stem":"Which pair identifies major Qing rulers associated with imperial expansion?","options":["Kangxi and Qianlong","Hongwu and Yongle","Akbar and Aurangzeb","Ivan III and Peter I"],"answer":0,"why":"Kangxi and Qianlong oversaw significant Qing territorial and administrative expansion.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-4","stem":"What did the Canton System regulate?","options":["Foreign commerce through Guangzhou under Qing restrictions","All trade at the Cape of Good Hope","Every Japanese daimyō appointment","Ottoman millet religious courts"],"answer":0,"why":"The Canton System concentrated and regulated much foreign commerce through Guangzhou.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-5","stem":"What was the kowtow in imperial diplomatic contexts?","options":["A ritual of kneeling and prostration demonstrating respect within court ceremonial systems","A tax on Ottoman Christians","An Atlantic cargo route","A military rank in Russia"],"answer":0,"why":"Kowtow was part of court ceremonial practice, with political significance in Qing foreign relations.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-6","stem":"Which chronology is accurate?","options":["Opium Wars and Treaty of Nanjing occurred in the nineteenth century, after 1750","Opium Wars preceded the Ming Dynasty","Treaty of Nanjing immediately followed the Yuan collapse","Opium Wars occurred during Zheng He’s first voyage"],"answer":0,"why":"The First Opium War was 1839–1842 and the Treaty of Nanjing was signed in 1842, outside the game’s core period.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"qing-7","stem":"Which statement best captures extraterritorial rights and Hong Kong after the First Opium War?","options":["The treaty settlement gave Britain Hong Kong and expanded unequal legal-commercial privileges","Hong Kong became the new Mughal capital","The Qing abolished all foreign commerce","The VOC won legal authority over Russia"],"answer":0,"why":"The 1842 Treaty of Nanjing ceded Hong Kong Island to Britain; extraterritorial privileges were established through subsequent arrangements.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"mughal","unit":3,"name":"Mughal South Asia","region":"South Asia","tag":"Diversity","description":"Babur, Akbar, Aurangzeb, administration, tolerance, belief and commerce.","connections":["maritime","ottoman","safavid"],"questions":[{"id":"mughal-1","stem":"Who founded the Mughal Empire in northern India in 1526?","options":["Babur","Aurangzeb","Shah Abbas","Suleyman I"],"answer":0,"why":"Babur defeated the Lodi ruler at Panipat and established the Mughal dynasty.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-2","stem":"Which policy is particularly associated with Akbar?","options":["Broad efforts toward religious accommodation across a diverse empire","A total prohibition on non-Muslim participation in government","The Tokugawa Closed Country Policy","A Qing treaty with Russia"],"answer":0,"why":"Akbar is associated with policies of religious accommodation and experiments in interfaith dialogue.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-3","stem":"What was Din-i-Ilahi?","options":["A small court-centered spiritual initiative associated with Akbar","The official religion of all Qing citizens","The sole basis for Portuguese shipping permits","A slave rebellion in Jamaica"],"answer":0,"why":"Din-i-Ilahi was Akbar’s limited spiritual initiative, not a mass religion practiced throughout India.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-4","stem":"What were mansabdars in Mughal government?","options":["Officials assigned ranks involving service and military obligations","Dutch shareholders who selected captains","Ottoman Christian communities under the millet system","Inca state labor conscripts"],"answer":0,"why":"The mansabdari system classified Mughal officials by rank and associated responsibilities.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-5","stem":"What was a zamindar?","options":["A landholder or local intermediary involved in revenue collection","A Portuguese maritime pass","A Manchu banner commander only","The title of the Safavid ruler"],"answer":0,"why":"Zamindars were varied landholding and revenue-intermediary elites important to Mughal administration.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-6","stem":"How did Aurangzeb differ from Akbar in religious policy?","options":["Aurangzeb more strongly emphasized Islamic law and restored jizya, unlike Akbar’s broader accommodation","Aurangzeb established the first Mughal dynasty before Babur","Aurangzeb ended military expansion","Akbar established the Tokugawa shogunate"],"answer":0,"why":"Aurangzeb restored the jizya and made different religious and political choices from Akbar, though actual practice remained complex.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-7","stem":"Which statement about Sikhism is most accurate?","options":["It began in Punjab in the late fifteenth century and developed amid South Asian religious interactions","It was invented by Akbar as Din-i-Ilahi","It was the sole faith of the Portuguese empire","It originated in twentieth-century Jamaica"],"answer":0,"why":"Sikhism developed from Guru Nanak’s teachings and succeeding Gurus, independently of Akbar’s Din-i-Ilahi.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"mughal-8","stem":"Who commissioned the Taj Mahal?","options":["Shah Jahan, a later Mughal emperor","Babur at Panipat","Akbar to mark his birth","Kangxi to regulate Chinese commerce"],"answer":0,"why":"Shah Jahan commissioned the Taj Mahal as a mausoleum for Mumtaz Mahal; it was not built by Akbar.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"ottoman","unit":3,"name":"Ottoman Empire","region":"West Asia","tag":"Administration","description":"Trade, ghazis, devshirme, Janissaries, millet communities and imperial rivalry.","connections":["exploration","safavid","mughal"],"questions":[{"id":"ottoman-1","stem":"Why was control of Constantinople/Istanbul significant for the Ottoman Empire?","options":["It offered a strategic imperial center linking commercial and political routes","It gave control of every Atlantic plantation","It was the birthplace of the Ming Dynasty","It ended all Mediterranean shipping"],"answer":0,"why":"Istanbul was a strategic center between Europe and Asia and a major hub of Ottoman government and commerce.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-2","stem":"What did the term ghazi signify in early Ottoman contexts?","options":["A warrior associated with frontier campaigns framed in religious terms","A Dutch commercial shareholder","A Chinese tribute official","An Inca tribute collector"],"answer":0,"why":"Ghazi often referred to frontier warriors and provided ideological framing for early Ottoman expansion.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-3","stem":"What was the devshirme system connected to?","options":["Recruitment of Christian boys for Ottoman state service, including Janissaries","Export of silver from Spanish Peru","Dutch spice auctions","The Tokugawa emperor’s succession"],"answer":0,"why":"Devshirme recruited boys from Christian communities for conversion and training in Ottoman military or administrative service.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-4","stem":"What did Janissaries contribute to Ottoman power?","options":["A centrally organized elite infantry force","The official priesthood of Ming China","A merchant fleet in the Philippines","The elected parliament of Russia"],"answer":0,"why":"Janissaries formed an important part of Ottoman infantry and state military power.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-5","stem":"How did the Ottoman millet framework relate to religious communities?","options":["It recognized certain religious communities with defined institutions and obligations","It required everyone to hold identical religious office","It was a Dutch ship design","It abolished taxation for all non-Muslims"],"answer":0,"why":"The millet system structured recognized non-Muslim communities within Ottoman rule; jizya was a tax levied on eligible non-Muslim subjects.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-6","stem":"Why is the Battle of Chaldiran (1514) important?","options":["Ottoman forces defeated Safavid armies, revealing the role of firearms and rival religious-political claims","Russia defeated the VOC in the Baltic","The Pueblo Revolt expelled the Spanish","The Ming conquered Tokugawa Japan"],"answer":0,"why":"At Chaldiran, Ottoman forces defeated Safavid forces and Ottoman firepower was important.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-7","stem":"Which ruler is strongly associated with Ottoman military, political and legal achievements?","options":["Suleyman I","Peter I","Po’pay","Hongwu"],"answer":0,"why":"Suleyman I presided over major Ottoman campaigns and the development of imperial legal-administrative institutions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"ottoman-8","stem":"What is a cautious way to discuss Ottoman decline?","options":["Long-term institutional, economic and military pressures mattered more than a single sudden cause","The empire fell in 1514 at Chaldiran","Fratricide alone explains every change for centuries","The empire ended immediately after Columbus sailed"],"answer":0,"why":"Ottoman decline was prolonged and complex; succession struggles and European influence are among several factors, not a single instant collapse.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"safavid","unit":3,"name":"Safavid Persia","region":"West Asia","tag":"Belief","description":"Shah Isma’il, Qizilbash, Abbas I, Shi’a rule and the Ottoman rivalry.","connections":["ottoman","mughal","maritime"],"questions":[{"id":"safavid-1","stem":"Who founded the Safavid dynasty as a major Persian empire in 1501?","options":["Shah Isma’il I","Akbar","Hongwu","King Afonso I"],"answer":0,"why":"Shah Isma’il I established Safavid rule and promoted Twelver Shi’a Islam as state religion.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-2","stem":"Why were the Qizilbash important to Safavid origins?","options":["They were tribal military supporters vital to Isma’il’s rise","They were Spanish shipbuilders","They were Ming tax assessors","They were Russian serfs"],"answer":0,"why":"Qizilbash forces helped Isma’il establish the Safavid state and remained politically important.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-3","stem":"How did Safavid religious policy contrast with the Sunni Ottoman Empire?","options":["Safavid rulers promoted Shi’a Islam, while Ottoman rulers predominantly adhered to Sunni Islam","The empires practiced identical state religious policy","The Safavids officially banned Islam","Ottoman rulers adopted Sikhism as state religion"],"answer":0,"why":"The contrast between Safavid Shi’a state policy and Ottoman Sunni political identity shaped rivalry.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-4","stem":"Which ruler reorganized military power and strengthened Safavid state authority?","options":["Shah Abbas I","Moctezuma II","Qianlong Emperor","Túpac Amaru II"],"answer":0,"why":"Shah Abbas I strengthened military and administrative institutions and is associated with Isfahan’s development.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-5","stem":"What was the result of the Battle of Chaldiran for the Safavids?","options":["An Ottoman victory limited Safavid expansion and exposed military disadvantages","A decisive Safavid conquest of Istanbul","The fall of the Ming Dynasty","The end of the Russian boyars"],"answer":0,"why":"Chaldiran in 1514 was a significant Ottoman victory against Shah Isma’il’s Safavid forces.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-6","stem":"Why was Isfahan important under the Safavids?","options":["A major imperial capital and center of architecture and Persian-Islamic culture","A harbor in the Spice Islands","The site of the Pueblo Revolt","The original capital of the Mughal Empire"],"answer":0,"why":"Isfahan became a celebrated Safavid capital, especially under Shah Abbas I.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"safavid-7","stem":"What factors contributed to later Safavid decline?","options":["Military, political and territorial pressures, including succession problems","The Battle of Sekigahara in Japan","The Columbian Exchange ending in 1492","The Qing Treaty of Nanjing in 1842"],"answer":0,"why":"Safavid decline involved political and military difficulties and loss of territory, rather than one isolated event.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]},{"id":"global","unit":0,"name":"Connections Across the World","region":"Global","tag":"Synthesis","description":"Follow evidence linking trade, silver, empire-building, labor, reform and resistance.","connections":["maritime","africa","ming","qing"],"questions":[{"id":"global-1","stem":"How did American silver connect Spanish colonization with Ming China?","options":["Silver mined in the Americas entered global markets where Ming taxes and trade raised demand","The Spanish paid all Ming taxes directly for the emperor","American silver was never exported a tutions while preserving distinct Manchu structures","The Qing abolished every earlier form of Chinese administration","Both dynasties were directly ruled by Dutch captains","Neither dynasty ever collected taxes"],"answer":0,"why":"Qing governance combined adaptation of existing Chinese administration with distinctive Manchu political and military institutions.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"global-6","stem":"Which paired policy comparison is strongest?","options":["Tokugawa maritime restrictions and Qing Canton regulation both controlled outside contacts but operated differently","Both completely eliminated foreign trade","Both involved Spanish encomienda quotas","Both were imposed by Suleyman I"],"answer":0,"why":"The Tokugawa and Qing cases show selective regulation of foreign contacts rather than identical total isolation.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"global-7","stem":"What parallel connects Ottoman, Safavid and Mughal empires?","options":["Each governed diverse populations and confronted questions of religious and military organization","All were ruled from the same capital","All followed the same official sect and tax policy","Each was exclusively a maritime trading company"],"answer":0,"why":"The three land-based empires used distinct systems to organize populations, military institutions and religious relationships.","hint":"Look for a cause-and-effect relationship rather than a familiar word."},{"id":"global-8","stem":"What can an historian infer from a ruler’s decree and a merchant’s letter describing the same event?","options":["Comparing sources reveals different interests, perspectives and limits of evidence","Only the ruler’s document can contain useful facts","Neither source needs dating or contextualization","A source’s purpose never affects interpretation"],"answer":0,"why":"Historical analysis compares author, date, audience, purpose and corroboration to assess claims.","hint":"Look for a cause-and-effect relationship rather than a familiar word."}]}],"characters":[{"id":"cortes","name":"Hernán Cortés","role":"Conquest and contested sources","unit":1,"where":"Mesoamerica","when":"1519–1521","archive":"ships","modules":["exploration","labor","resistance"],"intro":"Spanish military expansion transformed central Mexico, but Indigenous alliances, rivalries and resistance shaped events. Read both Spanish and Indigenous perspectives.","dilemma":"You are studying the first accounts of Cortés’s expedition. What evidence will you prioritize?","choices":[{"label":"A Spanish expedition letter","effect":"It reveals the conqueror’s claims and interests—but cannot stand alone."},{"label":"An Indigenous account and regional alliances","effect":"This highlights Indigenous agency and perspectives that Spanish triumph narratives may obscure."},{"label":"Comparing both kinds of evidence","effect":"Corroboration provides the strongest interpretation of conquest and its consequences."}],"bridge":"Moctezuma II → Po’pay → encomienda","later":false,"optional":false,"real":true},{"id":"moctezuma","name":"Moctezuma II","role":"An empire at a turning point","unit":1,"where":"Tenochtitlan","when":"1519–1520","archive":"world","modules":["exploration","labor","resistance"],"intro":"Moctezuma II ruled the Mexica Empire during the Spanish expedition led by Cortés; later sources differ about motives and choices.","dilemma":"Conflicting reports reach the court. Which historical skill best clarifies the encounter?","choices":[{"label":"Treat a Spanish account as complete","effect":"One source reflects particular interests and needs comparison."},{"label":"Examine diverse eyewitness and later accounts","effect":"Contrasting accounts helps distinguish claims from confident knowledge."},{"label":"Assume all people in Mexico held one view","effect":"The region contained varied political communities and alliances."}],"bridge":"Cortés → colonial labor → Po’pay","later":false,"optional":false,"real":true},{"id":"afonso","name":"King Afonso I of Kongo","role":"Diplomacy under pressure","unit":2,"where":"Kingdom of Kongo","when":"1506–1543","archive":"world","modules":["africa","labor","maritime"],"intro":"Afonso I maintained links with Portugal while criticizing abuses associated with the trafficking of people in Kongo.","dilemma":"A court letter reports that people are being seized and sold without lawful authority. Which response matches Afonso’s documented concerns?","choices":[{"label":"Investigate and protest unauthorized seizures","effect":"Afonso wrote to Portuguese authorities about the harms caused by unlawful trafficking."},{"label":"Ignore the political consequences of trafficking","effect":"The problem affected Kongo’s sovereignty and authority."},{"label":"Assume every Portuguese merchant followed the king’s wishes","effect":"Diplomacy did not guarantee control over commercial practices."}],"bridge":"Portuguese trade → Nzinga → plantations","later":false,"optional":false,"real":true},{"id":"nzinga","name":"Queen Nzinga","role":"Negotiation and sovereignty","unit":2,"where":"Ndongo and Matamba","when":"1620s–1660s","archive":"nzinga","modules":["resistance","africa","maritime"],"intro":"Nzinga negotiated and fought to preserve political autonomy amid Portuguese expansion in central Africa.","dilemma":"At a diplomatic meeting, your objective is to investigate how Nzinga defended state interests. What evidence matters?","choices":[{"label":"Treat diplomacy as unimportant beside battles","effect":"Her negotiations and alliances were central parts of her political strategy."},{"label":"Examine negotiation, alliances and military action together","effect":"Nzinga used more than one strategy as conditions changed."},{"label":"Assume African kingdoms lacked independent goals","effect":"Ndongo and Matamba exercised political agency within unequal pressures."}],"bridge":"Afonso I → Portuguese expansion → VOC rivalry","later":false,"optional":false,"real":true},{"id":"tupac","name":"Túpac Amaru II","role":"Rebellion in the Andes","unit":2,"where":"Colonial Peru","when":"1780–1781","archive":"world","modules":["resistance","labor","exploration"],"intro":"José Gabriel Condorcanqui, known as Túpac Amaru II, led a major uprising against Spanish colonial rule in 1780. This is a later consequence, outside 1450–1750.","dilemma":"Which earlier systems would help a historian explain the grievances associated with the rebellion?","choices":[{"label":"Colonial tribute and exploitative labor obligations","effect":"Labor obligations, tribute and colonial abuses help explain the uprising’s context."},{"label":"Only the Tokugawa Closed Country Policy","effect":"Japanese foreign-policy restrictions were not the principal causes of the revolt."},{"label":"Only Ming silver taxes","effect":"Global links matter, but Andean colonial conditions require direct investigation."}],"bridge":"mit’a → encomienda → Spanish empire","later":true,"optional":false,"real":true},{"id":"popay","name":"Po’pay","role":"The Pueblo Revolt","unit":2,"where":"New Mexico","when":"1680","archive":"popay","modules":["resistance","labor","exploration"],"intro":"Po’pay, a Tewa leader, helped organize Pueblo resistance against Spanish colonial domination and religious suppression.","dilemma":"Which forms of historical evidence would illuminate the Pueblo Revolt?","choices":[{"label":"Only statements written by Spanish officials","effect":"Spanish reports are useful but partial; Pueblo oral traditions and archaeological evidence matter too."},{"label":"Colonial records and Pueblo perspectives","effect":"Multiple kinds of evidence reveal both grievances and the organization of resistance."},{"label":"European shipping records alone","effect":"Atlantic commerce offers context but cannot explain local causes by itself."}],"bridge":"Spanish conquest → religious coercion → resistance","later":false,"optional":false,"real":true},{"id":"hongwu","name":"Hongwu Emperor","role":"Founding the Ming","unit":2,"where":"China","when":"1368–1398","archive":"zheng","modules":["ming","qing","maritime"],"intro":"Zhu Yuanzhang rose during the fall of Yuan rule and founded the Ming Dynasty. His reign predates the 1450 start of the review’s main period.","dilemma":"Which question best reveals continuity after the Ming founding?","choices":[{"label":"How did a new dynasty organize land, taxes and officials?","effect":"Examining administrative systems reveals both change and continuity."},{"label":"Which VOC official advised Hongwu?","effect":"The VOC was founded centuries later."},{"label":"How did Hongwu respond to the Opium Wars?","effect":"The Opium Wars occurred in the nineteenth century."}],"bridge":"Red Turbans → Ming administration → Qing","later":true,"optional":false,"real":true},{"id":"zheng","name":"Zheng He","role":"Admiral of Ming expeditions","unit":2,"where":"Indian Ocean","when":"1405–1433","archive":"zheng","modules":["ming","maritime","mughal"],"intro":"Zheng He led enormous Ming-sponsored voyages across the Indian Ocean before many later European trading ventures.","dilemma":"Which finding most strongly challenges the idea that Europeans invented Indian Ocean trade?","choices":[{"label":"Evidence of earlier ports, routes and Zheng He’s voyages","effect":"Established maritime systems existed before the Portuguese entered them."},{"label":"Only seventeenth-century VOC records","effect":"Those records begin too late to establish earlier networks alone."},{"label":"A map with no ports or coastlines","effect":"That would obscure rather than establish the routes."}],"bridge":"Indian Ocean networks → Portugal → Ming tribute","later":true,"optional":false,"real":true},{"id":"yongle","name":"Yongle Emperor","role":"Imperial knowledge and voyages","unit":2,"where":"Ming China","when":"1402–1424","archive":"zheng","modules":["ming","maritime","qing"],"intro":"The Yongle Emperor sponsored major state projects, including the Yongle Encyclopedia and Zheng He’s voyages.","dilemma":"Which paired evidence would best support a claim about Yongle’s achievements?","choices":[{"label":"Accounts of naval expeditions and the encyclopedia project","effect":"Together these illustrate state investment in diplomacy and knowledge."},{"label":"Peter the Great’s beard tax and the VOC charter","effect":"Both occurred centuries later and in different places."},{"label":"The 1842 Treaty of Nanjing alone","effect":"That treaty cannot directly establish Yongle’s fifteenth-century achievements."}],"bridge":"Zheng He → Asian networks → Ming–Qing change","later":true,"optional":false,"real":true},{"id":"ieyasu","name":"Tokugawa Ieyasu","role":"From war to shogunate","unit":2,"where":"Japan","when":"1600–1616","archive":"world","modules":["tokugawa","maritime","qing"],"intro":"Ieyasu’s victory at Sekigahara established dominance; the Tokugawa shogunate formed in 1603.","dilemma":"How should a historian explain Tokugawa unification?","choices":[{"label":"Link Sengoku conflicts, Sekigahara and the creation of the shogunate","effect":"This follows a defensible political and military sequence."},{"label":"Attribute all changes to the Portuguese cartaz","effect":"The cartaz governed another maritime context."},{"label":"Claim the emperor personally abolished all daimyo","effect":"Political authority and daimyo roles remained more complex."}],"bridge":"Portuguese Jesuits → regulated trade → Qing Canton","later":false,"optional":false,"real":true},{"id":"ivan","name":"Ivan III","role":"Moscow and autonomy","unit":3,"where":"Moscow","when":"1462–1505","archive":"world","modules":["russia","ottoman","qing"],"intro":"Ivan III expanded Muscovite power and weakened domination by the Golden Horde.","dilemma":"Which development most helps explain Russia’s increasing autonomy?","choices":[{"label":"Centralization around Moscow and an end to Horde tribute","effect":"These strengthened Muscovite political independence."},{"label":"A Dutch charter for a Russian VOC","effect":"The VOC was a separate commercial corporation."},{"label":"The First Opium War in China","effect":"That event occurred centuries later."}],"bridge":"Golden Horde → Muscovy → Peter I","later":false,"optional":false,"real":true},{"id":"peter","name":"Peter the Great","role":"Reform and Westernization","unit":3,"where":"Russia","when":"1682–1725","archive":"world","modules":["russia","maritime","qing"],"intro":"Peter I pushed reforms that reshaped Russia’s administration, military and relationships with Europe.","dilemma":"Which evidence best connects his westernizing agenda to change?","choices":[{"label":"St. Petersburg and policies such as the beard tax","effect":"These are visible signs of attempts to reorient state and elite culture."},{"label":"The founding of Tenochtitlan","effect":"Not an example of Russian reform."},{"label":"Abolition of serfdom by Ivan III","effect":"That is not the reform described in the curriculum."}],"bridge":"Baltic trade → European technology → continuity in monarchy","later":false,"optional":false,"real":true},{"id":"kangxi","name":"Kangxi Emperor","role":"Consolidating Qing rule","unit":3,"where":"Qing China","when":"1661–1722","archive":"world","modules":["qing","ming","russia"],"intro":"Kangxi consolidated Qing authority and negotiated the 1689 Treaty of Nerchinsk with Russia.","dilemma":"Which paired subjects best explain his foreign and domestic challenges?","choices":[{"label":"Banner institutions and diplomacy with Russia","effect":"These connect Manchu rule to military organization and diplomacy."},{"label":"The VOC founding and the Taj Mahal","effect":"Neither directly defines Kangxi’s governing methods."},{"label":"Spanish encomienda and the Pueblo Revolt","effect":"These belong to other imperial settings."}],"bridge":"Ming–Qing change → Nerchinsk → Qianlong","later":false,"optional":false,"real":true},{"id":"qianlong","name":"Qianlon tion and administration with other empires’ governing choices","effect":"This tests how states managed diverse populations."},{"label":"Assume every Ottoman, Safavid and Mughal policy was identical","effect":"The three empires differed significantly."},{"label":"Treat Din-i-Ilahi as the required faith of all Mughal subjects","effect":"It was a limited court initiative, not a universal religion."}],"bridge":"Akbar → Ottoman millet → Safavid Shi’a","later":false,"optional":false,"real":true},{"id":"aurangzeb","name":"Aurangzeb","role":"Mughal authority and religion","unit":3,"where":"Mughal India","when":"1658–1707","archive":"taj","modules":["mughal","ottoman","safavid"],"intro":"Aurangzeb expanded Mughal campaigns and adopted policies differing in important respects from Akbar’s.","dilemma":"Which comparison is most useful for an exam response?","choices":[{"label":"Explain contrasts in jizya policy, religious emphasis and imperial expansion","effect":"The differences help analyze continuity and change within Mughal governance."},{"label":"State that Aurangzeb founded the Mughal dynasty","effect":"Babur founded the dynasty earlier."},{"label":"Say Akbar and Aurangzeb had identical policies","effect":"Their religious and administrative choices differed."}],"bridge":"Akbar → jizya → Ottoman comparison","later":false,"optional":false,"real":true},{"id":"suleyman","name":"Suleyman I","role":"Imperial administration","unit":3,"where":"Ottoman Empire","when":"1520–1566","archive":"suleyman","modules":["ottoman","safavid","exploration"],"intro":"Suleyman presided over Ottoman campaigns, law and imperial administration while Europe’s maritime trade expanded.","dilemma":"Which evidence best illustrates Ottoman military and administrative strength?","choices":[{"label":"Janissaries, territorial campaigns and legal-administrative institutions","effect":"These span military and governing achievements."},{"label":"The VOC’s seventeenth-century charter alone","effect":"This does
